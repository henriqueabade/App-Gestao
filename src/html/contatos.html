<!-- Interface principal do módulo de Contatos (CRM): fornecedores, prestadores de serviço e parceiros -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos - Santíssimo Decor</title>
    <link rel="stylesheet" href="../styles/tailwind-offline.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Estilos exclusivos do módulo de Contatos -->
    <link rel="stylesheet" href="../css/contatos.css">
    <!-- Estilos globais para barras de rolagem -->
    <link rel="stylesheet" href="../styles/scroll.css">
</head>
<body class="text-white">
  <div class="modulo-container ctl-padrao">
    <div>
        <!-- Header -->
        <div class="contatos-header flex justify-between items-center mb-8 animate-fade-in-up">
            <div>
                <h1 class="text-2xl font-semibold mb-2 module-header__title">Contatos</h1>
                <p class="module-header__description">Fornecedores, prestadores de serviço e parceiros</p>
            </div>
            <div class="contatos-header__actions ctl-acoes">
                <div id="acoesRapidasContainer" class="acoes-rapidas">
                    <button id="btnAcoesRapidas" type="button" class="btn-bordo ctl-botao text-white" aria-haspopup="menu" aria-expanded="false" aria-controls="menuAcoesRapidas">
                        <i class="fas fa-bolt" aria-hidden="true"></i>
                        Ações Rápidas
                        <i class="fas fa-chevron-down acoes-rapidas__chevron" aria-hidden="true"></i>
                    </button>
                    <div id="menuAcoesRapidas" class="acoes-rapidas__menu" role="menu" aria-label="Ações rápidas de contatos" hidden>
                        <button id="btnExportarCSV" data-perm="ctt.export.csv" type="button" role="menuitem" class="acoes-rapidas__item">
                            <i class="fas fa-download" aria-hidden="true"></i><span>Exportar CSV</span>
                        </button>
                        <button id="btnImportarCSV" data-perm="ctt.import.csv" type="button" role="menuitem" class="acoes-rapidas__item">
                            <i class="fas fa-upload" aria-hidden="true"></i><span>Importar CSV</span>
                        </button>
                        <button id="btnModeloCSV" data-perm="ctt.import.csv" type="button" role="menuitem" class="acoes-rapidas__item">
                            <i class="fas fa-file-csv" aria-hidden="true"></i><span>Salvar modelo CSV</span>
                        </button>
                        <button id="btnGerarRelatorio" data-perm="ctt.report" type="button" role="menuitem" class="acoes-rapidas__item">
                            <i class="fas fa-file-alt" aria-hidden="true"></i><span>Gerar Relatório</span>
                        </button>
                        <button id="btnEnviarEmailMassa" data-perm="ctt.email.bulk" type="button" role="menuitem" class="acoes-rapidas__item">
                            <i class="fas fa-envelope" aria-hidden="true"></i><span>Enviar E-mail em Massa</span>
                        </button>
                    </div>
                </div>
                <button id="btnNovoContato" data-perm="ctt.create" class="btn-primary ctl-botao text-white">
                    <i class="fas fa-plus mr-2"></i>Novo Contato
                </button>
            </div>
        </div>

        <!-- Filtros e totais -->
        <div class="glass-surface rounded-xl p-6 mb-6 animate-fade-in-up">
            <div class="filter-bar flex flex-col md:flex-row md:flex-wrap xl:flex-nowrap items-end">
                <div class="flex-1 min-w-[250px]">
                    <label class="ctl-rotulo text-white">Buscar Contato</label>
                    <input id="filtroBusca" data-perm="ctt.search" type="text" placeholder="Nome, CNPJ, cidade ou e-mail" class="ctl-campo input-glass text-white w-full">
                </div>

                <div class="flex-1 min-w-[200px]">
                    <label class="ctl-rotulo text-white">Tipo</label>
                    <select id="filtroTipo" data-perm="ctt.search" class="ctl-campo input-glass text-white w-full">
                        <option value="">Todos</option>
                    </select>
                </div>

                <div class="flex-1 min-w-[200px]">
                    <label class="ctl-rotulo text-white">Status</label>
                    <select id="filtroStatus" data-perm="ctt.search" class="ctl-campo input-glass text-white w-full">
                        <option value="">Todos</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <label class="ctl-rotulo text-white">Totais por Tipo</label>
                    <div id="totaisBadges" class="tags-uma-linha"></div>
                </div>

                <div id="bt-actions" class="ctl-acoes">
                    <button id="btnFiltrar" data-perm="ctt.search" class="btn-secondary ctl-botao text-white">Filtrar</button>
                    <button id="btnLimpar" data-perm="ctt.search" class="btn-warning ctl-botao text-white">Limpar</button>
                </div>
            </div>
        </div>

        <!-- Aviso do SQL (só aparece quando as tabelas ainda não existem) -->
        <div id="contatosSqlAviso" class="hidden glass-surface rounded-xl p-6 mb-6 text-sm" role="alert"></div>

        <!-- Tabela -->
        <div id="contatosTableWrapper" data-perm-hide="ctt.view" class="glass-surface rounded-xl shadow-lg animate-fade-in-up table-scroll">
            <table class="w-full">
                <thead class="bg-gray-50 sticky top-0">
                        <tr>
                            <th data-perm-col="col_ctt_nome" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nome</th>
                            <th data-perm-col="col_ctt_tipo" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tipo</th>
                            <th data-perm-col="col_ctt_cnpj" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">CNPJ</th>
                            <th data-perm-col="col_ctt_tel" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Celular</th>
                            <th data-perm-col="col_ctt_fixo" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Telefone</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="contatosTableBody" class="divide-y divide-white/10">
                        <!-- Linhas geradas dinamicamente -->
                    </tbody>
                </table>
        </div>

        <!-- Empty State -->
        <div id="contatosEmptyState" class="hidden py-12 flex flex-col items-center justify-center text-center px-4">
          <div class="rounded-full bg-[var(--color-primary-opacity)] p-8 mb-6">
            <i class="fas fa-address-book text-8xl text-[var(--color-primary)]"></i>
          </div>
          <h3 class="text-lg font-medium text-white">Nenhum contato encontrado</h3>
          <p class="mt-1 text-sm text-white/70">Cadastre o primeiro fornecedor ou prestador agora!</p>
          <div class="mt-6">
            <button
              id="contatosEmptyNew" data-perm="ctt.create"
              type="button"
              class="btn-primary ctl-botao text-white"
            >
              <i class="fas fa-plus w-4 h-4 mr-2"></i>
              Novo Contato
            </button>
          </div>
        </div>
    </div>
</div>
</body>
</html>
