<!-- Interface principal do módulo de Clientes (CRM) -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Santíssimo Decor</title>
    <!-- Tailwind for quick layout -->
    <link rel="stylesheet" href="../styles/tailwind-offline.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Estilos específicos do módulo -->
    <link rel="stylesheet" href="../css/clientes.css">
    <!-- Estilos globais para barras de rolagem -->
    <link rel="stylesheet" href="../styles/scroll.css">
</head>
<body class="text-white">
  <div class="modulo-container">
    <div>
        <!-- Header -->
        <div class="clientes-header flex justify-between items-center mb-8 animate-fade-in-up">
            <div>
                <h1 class="text-2xl font-semibold mb-2 module-header__title">Clientes</h1>
                <p class="module-header__description">Gerencie informações e relacionamento com clientes</p>
            </div>
            <div class="clientes-header__actions flex items-center gap-3">
                <div id="acoesRapidasContainer" class="acoes-rapidas">
                    <button id="btnAcoesRapidas" type="button" class="btn-bordo text-white rounded-md px-4 py-3 font-medium flex items-center gap-2" aria-haspopup="menu" aria-expanded="false" aria-controls="menuAcoesRapidas">
                        <i class="fas fa-bolt" aria-hidden="true"></i>
                        Ações Rápidas
                        <i class="fas fa-chevron-down acoes-rapidas__chevron" aria-hidden="true"></i>
                    </button>
                    <div id="menuAcoesRapidas" class="acoes-rapidas__menu" role="menu" aria-label="Ações rápidas de clientes" hidden>
                        <button id="btnExportarCSV" data-perm="cli.export.csv" type="button" role="menuitem" class="acoes-rapidas__item">
                            <i class="fas fa-download" aria-hidden="true"></i><span>Exportar CSV</span>
                        </button>
                        <button id="btnImportarCSV" data-perm="cli.import.csv" type="button" role="menuitem" class="acoes-rapidas__item">
                            <i class="fas fa-upload" aria-hidden="true"></i><span>Importar CSV</span>
                        </button>
                        <button id="btnGerarRelatorio" data-perm="cli.report" type="button" role="menuitem" class="acoes-rapidas__item">
                            <i class="fas fa-file-alt" aria-hidden="true"></i><span>Gerar Relatório</span>
                        </button>
                        <button id="btnEnviarEmailMassa" data-perm="cli.email.bulk" type="button" role="menuitem" class="acoes-rapidas__item">
                            <i class="fas fa-envelope" aria-hidden="true"></i><span>Enviar E-mail em Massa</span>
                        </button>
                    </div>
                </div>
                <button id="btnNovoCliente" data-perm="cli.create" class="btn-primary text-white rounded-md px-6 py-3 font-medium">
                    <i class="fas fa-plus mr-2"></i>Novo Cliente
                </button>
            </div>
        </div>

        <!-- Filters & Statistics Panel -->
        <div class="glass-surface rounded-xl p-6 mb-6 animate-fade-in-up">
            <div class="filter-bar flex flex-col md:flex-row md:flex-wrap xl:flex-nowrap items-center">
                <!-- Search -->
                <div class="flex-1 min-w-[250px]">
                    <label class="block text-sm font-medium mb-2 text-white">Buscar Cliente</label>
                    <input id="filtroBusca" data-perm="cli.search" type="text" placeholder="Estado, CNPJ ou Nome" class="input-glass text-white rounded-md px-4 py-3 w-full">
                </div>

                <!-- Dono Select -->
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-sm font-medium mb-2 text-white">Dono</label>
                    <select id="filtroDono" data-perm="cli.search" class="input-glass text-white rounded-md px-4 py-3 w-full">
                        <option value="">Todos</option>
                    </select>
                </div>

                <!-- Status Select -->
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-sm font-medium mb-2 text-white">Status</label>
                    <select id="filtroStatus" data-perm="cli.search" class="input-glass text-white rounded-md px-4 py-3 w-full">
                        <option value="">Todos</option>
                    </select>
                </div>

                <!-- Totals -->
                 <div class="flex flex-col">
                    <label class="block text-sm font-medium mb-1 text-white">Totais por Tipo</label>
                    <div id="totaisBadges" class="flex flex-wrap gap-2"></div>
                </div>

                <!-- Actions -->
                <div id="bt-actions" class="flex items-center gap-2">
                    <button id="btnFiltrar" data-perm="cli.search" class="btn-secondary text-white rounded-md px-4 py-3 text-sm font-medium">Filtrar</button>
                    <button id="btnLimpar" data-perm="cli.search" class="btn-warning text-white rounded-md px-4 py-3 text-sm font-medium">Limpar</button>
                </div>
            </div>
        </div>

        <!-- Clients Table -->
        <div id="clientesTableWrapper" data-perm-hide="cli.view" class="glass-surface rounded-xl shadow-lg animate-fade-in-up table-scroll">
            <table class="w-full">
                <thead class="bg-gray-50 sticky top-0">
                        <tr>
                            <th data-perm-col="col_cli_nome_fantasia" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nome</th>
                            <th data-perm-col="col_cli_cnpj" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">CNPJ</th>
                            <th data-perm-col="col_cli_pais" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">País</th>
                            <th data-perm-col="col_cli_cidade_uf" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                            <th data-perm-col="col_cli_status" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th data-perm-col="col_cli_owner" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Dono</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="clientesTableBody" class="divide-y divide-white/10">
                        <!-- Linhas geradas dinamicamente -->
                    </tbody>
                </table>
        </div>

        <!-- Empty State -->
        <div id="clientesEmptyState" class="hidden py-12 flex flex-col items-center justify-center text-center px-4">
          <div class="rounded-full bg-[var(--color-primary-opacity)] p-8 mb-6">
            <i class="fas fa-box-open text-8xl text-[var(--color-primary)]"></i>
          </div>
          <h3 class="text-lg font-medium text-white">Nenhum cliente encontrado</h3>
          <p class="mt-1 text-sm text-white/70">Cadastre o primeiro agora!</p>
          <div class="mt-6">
            <button
              id="clientesEmptyNew" data-perm="cli.create"
              type="button"
              class="btn-primary inline-flex items-center px-4 py-2 text-sm font-medium rounded-md text-white"
            >
              <i class="fas fa-plus w-4 h-4 mr-2"></i>
              Novo Cliente
            </button>
          </div>
        </div>
    </div>
</div>
</body>
</html>
