<!-- Tela de Calendário (CRM) — src/js/calendario.js -->
<div class="modulo-container calendario-modulo tui-escopo">
    <header class="cal-cabecalho animate-fade-in-up">
        <div>
            <h1 class="text-2xl font-semibold mb-1 module-header__title">Calendário</h1>
            <p class="module-header__description">Tarefas, atividades feitas e marcos dos clientes e prospecções, num lugar só</p>
        </div>
        <div class="cal-cabecalho__acoes">
            <button id="calBtnExportar" type="button" data-perm="tarefas.export" class="btn-neutral cal-botao">
                <i class="fas fa-file-export" aria-hidden="true"></i> Google / Outlook
            </button>
            <button id="calBtnNova" type="button" data-perm="tarefas.create" class="btn-primary cal-botao">
                <i class="fas fa-plus" aria-hidden="true"></i> Nova tarefa
            </button>
        </div>
    </header>

    <div id="calAvisoSql" class="tui-aviso-sql" hidden>
        <i class="fas fa-database" aria-hidden="true"></i>
        <span>O calendário ainda não está ativado no banco: rode <strong>sql/tarefas_calendario.sql</strong> e reinicie a API.</span>
    </div>

    <!-- Barra: visão, navegação, período e pessoa -->
    <div class="cal-barra animate-fade-in-up">
        <div class="cal-visoes" role="tablist" aria-label="Visão do calendário">
            <button type="button" data-visao="mes" role="tab" title="Mês (M)">Mês</button>
            <button type="button" data-visao="semana" role="tab" title="Semana (S)">Semana</button>
            <button type="button" data-visao="dia" role="tab" title="Dia (D)">Dia</button>
            <button type="button" data-visao="agenda" role="tab" title="Agenda (A)">Agenda</button>
            <button type="button" data-visao="equipe" role="tab" title="Equipe (E)" hidden>Equipe</button>
        </div>
        <div class="cal-navegacao">
            <button id="calAnterior" type="button" class="cal-icone-botao" title="Anterior (←)" aria-label="Anterior"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
            <button id="calHoje" type="button" class="cal-hoje" title="Hoje (T)">Hoje</button>
            <button id="calProximo" type="button" class="cal-icone-botao" title="Próximo (→)" aria-label="Próximo"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
            <h2 id="calTitulo" class="cal-titulo" aria-live="polite"></h2>
        </div>
        <div class="cal-barra__direita">
            <div id="calZoom" class="cal-zoom" role="group" aria-label="Zoom da grade de horas" hidden>
                <button id="calZoomMenos" type="button" class="cal-icone-botao" title="Afastar (Ctrl + rolar para baixo)" aria-label="Afastar"><i class="fas fa-magnifying-glass-minus" aria-hidden="true"></i></button>
                <span id="calZoomRotulo" class="cal-zoom__rotulo" title="De quanto em quanto aparece o horário">1 h</span>
                <button id="calZoomMais" type="button" class="cal-icone-botao" title="Aproximar (Ctrl + rolar para cima)" aria-label="Aproximar"><i class="fas fa-magnifying-glass-plus" aria-hidden="true"></i></button>
            </div>
            <select id="calPessoa" class="cal-select" aria-label="De quem" hidden></select>
            <button id="calAjuda" type="button" class="cal-icone-botao" title="Atalhos ( ? )" aria-label="Atalhos de teclado"><i class="fas fa-keyboard" aria-hidden="true"></i></button>
        </div>
    </div>

    <div class="cal-corpo animate-fade-in-up">
        <!-- Lateral: mini calendário, camadas e listas -->
        <aside class="cal-lado" aria-label="Filtros do calendário">
            <section id="calMini" class="cal-mini" aria-label="Mini calendário"></section>
            <section class="cal-lado__grupo">
                <h3 class="cal-lado__titulo">O que mostrar <span id="calContagemRotulo" class="cal-lado__periodo"></span></h3>
                <div id="calCamadas"></div>
                <label class="cal-opcao"><input id="calConcluidas" type="checkbox" checked> Mostrar concluídas</label>
            </section>
            <section class="cal-lado__grupo" id="calListasGrupo">
                <h3 class="cal-lado__titulo">Minhas listas</h3>
                <div id="calListas"></div>
            </section>
            <section class="cal-lado__grupo">
                <h3 class="cal-lado__titulo">Tipos</h3>
                <div id="calLegenda" class="cal-legenda"></div>
            </section>
        </aside>

        <section id="calArea" class="cal-area" aria-live="polite"></section>
    </div>
</div>
