<!--
  Atividade recente — o histórico inteiro da Contabilidade, em linha do
  tempo, no molde da Atividade do Financeiro: quem fez (com a foto), quando,
  o quê, com a etiqueta do tipo e a competência. Abre pelo "Ver todas" do
  cartão da tela. Modal grande, só de consulta.
  Dados: GET /api/contabilidade/atividade?limite=500; a foto e o nome vêm de
  GET /api/usuarios/lista.
  Script: src/js/modals/contabilidade-modais.js (montarAtividade).
-->
<div id="ctbAtividadeOverlay" data-ctb-modal class="hidden fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4 pt-[4vw] ctl-padrao" aria-hidden="true">
  <div role="dialog" aria-modal="true" aria-labelledby="ctbAtividadeTitulo" class="w-full max-w-5xl h-[90vh] glass-surface backdrop-blur-xl rounded-3xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade slide-in overflow-hidden flex flex-col">

    <header class="grid grid-cols-3 items-center px-8 py-5 border-b border-white/10 flex-shrink-0">
      <button type="button" data-ctb-fechar class="btn-neutral ctl-botao text-white justify-self-start">← Voltar</button>
      <div class="text-center min-w-0">
        <h2 id="ctbAtividadeTitulo" class="ctl-modal-titulo text-white truncate"><i class="fas fa-stream mr-2" aria-hidden="true"></i>Atividade recente</h2>
        <p class="text-xs text-gray-300 truncate">Quem fez o quê, do mais novo ao mais antigo</p>
      </div>
      <span id="ctbAtividadeContagem" class="badge-neutral px-3 py-1 rounded-full text-xs font-medium justify-self-end">—</span>
    </header>

    <div class="flex-1 overflow-y-auto modal-scroll">
      <section class="px-8 py-6 space-y-6">
        <div class="ctb-filtros-atividade">
          <div>
            <label for="ctbAtividadeBusca" class="ctl-rotulo text-gray-300">Buscar</label>
            <input id="ctbAtividadeBusca" type="text" autocomplete="off" placeholder="Documento, conta, extrato, competência, motivo…"
                   class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
          <div>
            <label for="ctbAtividadeTipo" class="ctl-rotulo text-gray-300">Tipo</label>
            <select id="ctbAtividadeTipo" class="w-full appearance-none select-arrow ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition">
              <option value="">Todos</option>
            </select>
          </div>
          <div>
            <label for="ctbAtividadeQuem" class="ctl-rotulo text-gray-300">Quem fez</label>
            <select id="ctbAtividadeQuem" class="w-full appearance-none select-arrow ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition">
              <option value="">Todos</option>
            </select>
          </div>
        </div>

        <div id="ctbAtividadeMensagem" class="hidden text-sm" role="alert"></div>
        <ol id="ctbAtividadeLinha" class="ctb-linha-tempo" aria-label="Linha do tempo"></ol>
        <p id="ctbAtividadeVazio" class="hidden ctb-vazio">Nenhum movimento com esse filtro.</p>
      </section>
    </div>

    <footer class="px-8 py-5 border-t border-white/10 ctl-acoes justify-end flex-shrink-0">
      <button type="button" data-ctb-fechar class="btn-danger ctl-botao text-white min-w-[120px]">Fechar</button>
    </footer>
  </div>
</div>
