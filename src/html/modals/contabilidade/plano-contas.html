<!--
  Plano de contas (etapa 6). Modal médio. As categorias da contabilidade — o
  "Tipo" do relatório mensal (GET /api/contabilidade/plano-contas) — com o uso
  de cada uma (contas a pagar, regras, lançamentos à mão) e o cadastro/edição
  (POST e PUT, contabilidade.plano.gerir). Não se apaga: desativa. Renomear
  leva a categoria das contas a pagar junto.
  Script: src/js/modals/contabilidade-modais.js (montarPlanoContas).
-->
<div id="ctbPlanoContasOverlay" data-ctb-modal class="hidden fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4 pt-[4vw] ctl-padrao" aria-hidden="true">
  <div role="dialog" aria-modal="true" aria-labelledby="ctbPlanoTitulo" class="w-full max-w-4xl max-h-[90vh] glass-surface backdrop-blur-xl rounded-3xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade slide-in overflow-hidden flex flex-col">

    <header class="grid grid-cols-3 items-center px-8 py-5 border-b border-white/10 flex-shrink-0">
      <button type="button" data-ctb-fechar class="btn-neutral ctl-botao text-white justify-self-start">← Voltar</button>
      <h2 id="ctbPlanoTitulo" class="ctl-modal-titulo text-white text-center truncate"><i class="fas fa-sitemap mr-2" aria-hidden="true"></i>Plano de contas</h2>
      <span id="ctbPlanoRotulo" class="badge-neutral px-3 py-1 rounded-full text-xs font-medium justify-self-end">—</span>
    </header>

    <div class="flex-1 overflow-y-auto modal-scroll">
      <section class="px-8 py-6 space-y-6">
        <p class="text-xs text-gray-400">Começa com as quatro categorias do relatório da contabilidade e as que o app usa para classificar sozinho. Transferência e patrimônio não entram no resultado do mês.</p>

        <div class="ctb-tabela ctb-tabela--curta glass-surface rounded-xl border border-white/10">
          <table class="w-full text-sm">
            <thead>
              <tr>
                <th class="px-4 py-3 text-left text-xs">Conta</th>
                <th class="px-4 py-3 text-left text-xs">Tipo</th>
                <th class="px-4 py-3 text-left text-xs">Uso</th>
                <th class="px-4 py-3 text-left text-xs">Situação</th>
                <th class="px-4 py-3 text-right text-xs">Ações</th>
              </tr>
            </thead>
            <tbody id="ctbPlanoLista"></tbody>
          </table>
        </div>

        <div class="ctb-secao-modal" data-perm-hide="contabilidade.plano.gerir">
          <div class="ctb-secao-modal__cabeca">
            <h3 id="ctbPlanoFormTitulo" class="ctl-secao text-[var(--color-primary)]">Nova conta</h3>
            <button id="ctbPlanoNova" type="button" class="hidden btn-neutral ctl-botao ctl-botao--pequeno text-white">Cadastrar outra</button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2">
              <label for="ctbPlanoNome" class="ctl-rotulo text-gray-300">Nome <span class="ctb-obrigatorio">*</span></label>
              <input id="ctbPlanoNome" type="text" maxlength="80" placeholder="Ex.: Energia elétrica"
                     class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
            </div>
            <div>
              <label for="ctbPlanoCodigo" class="ctl-rotulo text-gray-300">Código</label>
              <input id="ctbPlanoCodigo" type="text" maxlength="20" placeholder="Opcional"
                     class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
            </div>
            <div>
              <label for="ctbPlanoTipo" class="ctl-rotulo text-gray-300">Tipo</label>
              <select id="ctbPlanoTipo" class="w-full appearance-none select-arrow ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition"></select>
            </div>
            <div class="flex items-end">
              <label class="flex items-center gap-2 text-sm text-gray-300"><input id="ctbPlanoAtiva" type="checkbox" checked class="w-4 h-4" /> Conta ativa</label>
            </div>
            <div class="md:col-span-3">
              <label for="ctbPlanoObservacao" class="ctl-rotulo text-gray-300">Observação</label>
              <textarea id="ctbPlanoObservacao" rows="2" maxlength="500" placeholder="Opcional (o que entra nesta conta)"
                        class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition"></textarea>
            </div>
          </div>
        </div>

        <div id="ctbPlanoMensagem" class="hidden text-sm" role="alert"></div>
      </section>
    </div>

    <footer class="px-8 py-5 border-t border-white/10 ctl-acoes justify-end flex-shrink-0">
      <button type="button" data-ctb-fechar class="btn-danger ctl-botao text-white min-w-[120px]">Fechar</button>
      <button id="ctbPlanoSalvar" type="button" data-perm="contabilidade.plano.gerir" class="btn-primary ctl-botao text-white min-w-[160px]">Salvar conta</button>
    </footer>
  </div>
</div>
