<div id="novoProcessoOverlay" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 ctl-padrao">
  <div class="max-w-sm w-full glass-surface backdrop-blur-xl rounded-2xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade">
    <header class="relative px-6 py-4 border-b border-white/10">
      <h2 class="ctl-modal-titulo text-center text-white">INSERIR NOVO</h2>
      <button id="fecharNovoProcesso" class="btn-danger ctl-botao ctl-botao--pequeno ctl-botao--icone absolute right-4 top-4 text-white">✕</button>
    </header>
    <form id="novoProcessoForm" class="p-6">
      <div class="relative">
        <input id="nomeProcesso" name="nome" type="text" placeholder=" " required class="peer w-full ctl-campo bg-input border border-inputBorder text-white placeholder-transparent focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          <label for="nomeProcesso" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-valid:top-0 peer-valid:-translate-y-full peer-valid:text-xs">Nome</label>
      </div>
      <div class="relative mt-4 w-24">
        <input id="ordemProcesso" name="ordem" type="number" min="1" placeholder=" " required class="peer w-full ctl-campo bg-input border border-inputBorder text-white placeholder-transparent focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          <label for="ordemProcesso" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-valid:top-0 peer-valid:-translate-y-full peer-valid:text-xs">Ordem</label>
      </div>
    </form>
    <footer class="flex justify-end px-6 py-4 border-t border-white/10">
      <button type="submit" form="novoProcessoForm" class="btn-primary ctl-botao text-white active:scale-95">Inserir</button>
    </footer>
  </div>
</div>
