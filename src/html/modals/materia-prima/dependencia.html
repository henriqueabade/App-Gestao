<!-- Aviso: o item (categoria, unidade, processo, coleção) está em uso e não pode sair.
     Mesmo visual da caixa padrão (src/styles/dialogo-padrao.css). -->
<div id="dependenciaOverlay" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 ctl-padrao">
  <div class="dlg-cartao dlg-cartao--aviso" style="width: min(30rem, calc(100vw - 2rem))" role="dialog" aria-modal="true" aria-labelledby="dependenciaTitulo">
    <div class="dlg-topo">
      <div class="dlg-icone"><i class="fas fa-link" aria-hidden="true"></i></div>
      <h3 id="dependenciaTitulo" class="dlg-titulo">Não é possível excluir</h3>
      <p class="dlg-subtitulo">Este item ainda está em uso</p>
    </div>
    <div class="dlg-corpo">
      <p class="dlg-lead">Existem registros que dependem deste item, então a operação não pode ser feita.</p>
      <div class="dlg-nota"><i class="fas fa-circle-info" aria-hidden="true"></i><span>Troque o item nos registros que o usam e tente de novo.</span></div>
    </div>
    <div class="dlg-rodape">
      <button id="fecharDependencia" type="button" class="btn-primary ctl-botao">OK</button>
    </div>
  </div>
</div>
