<!-- Aviso: já existe um insumo com o nome digitado.
     Mesmo visual da caixa padrão (src/styles/dialogo-padrao.css). -->
<div id="duplicadoOverlay" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 ctl-padrao">
  <div class="dlg-cartao dlg-cartao--aviso" style="width: min(30rem, calc(100vw - 2rem))" role="dialog" aria-modal="true" aria-labelledby="duplicadoTitulo">
    <div class="dlg-topo">
      <div class="dlg-icone"><i class="fas fa-clone" aria-hidden="true"></i></div>
      <h3 id="duplicadoTitulo" class="dlg-titulo">Insumo já cadastrado</h3>
    </div>
    <div class="dlg-corpo">
      <p class="dlg-lead">Já existe um insumo com este nome.</p>
      <div class="dlg-nota"><i class="fas fa-circle-info" aria-hidden="true"></i><span>Use outro nome ou edite o insumo que já existe.</span></div>
    </div>
    <div class="dlg-rodape">
      <button id="fecharDuplicado" type="button" class="btn-primary ctl-botao">OK</button>
    </div>
  </div>
</div>
