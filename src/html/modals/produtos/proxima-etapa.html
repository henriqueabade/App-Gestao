<div id="proximaEtapaOverlay" class="fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4 ctl-padrao">
  <div role="dialog" aria-modal="true" tabindex="0" class="w-full max-w-7xl h-[90vh] bg-surface/60 backdrop-blur-xl rounded-3xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade slide-in overflow-hidden flex flex-col">
      <header class="flex flex-wrap items-center justify-between gap-4 px-8 py-5 border-b border-white/10 flex-shrink-0">
        <button id="voltarProximaEtapa" class="btn-neutral ctl-botao text-white">← Voltar</button>
        <h2 id="proximaEtapaTitulo" class="ctl-modal-titulo text-white flex-1 text-center"></h2>
        <div class="flex items-center gap-3">
          <button id="registrarProximaEtapa" data-perm="prod.stage.insert" class="btn-primary ctl-botao text-white">Registrar</button>
        </div>
      </header>
    <div class="flex-1 min-h-0 overflow-hidden flex flex-col">
      <div class="px-8 py-6 border-b border-white/10">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
          <div class="md:col-span-2">
            <!-- carga filtrada conforme título -->
            <select id="proximaEtapaItem" class="w-full ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition select-arrow appearance-none">
              <option value="">Nome do Item</option>
            </select>
          </div>
          <div class="relative">
            <input id="proximaEtapaQuantidade" type="number" placeholder="Quantidade" min="1" class="w-full ctl-campo ctl-campo--sufixo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
            <span id="proximaEtapaUnidade" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-sm text-gray-300 pointer-events-none"></span>
          </div>
        </div>
        <div class="ctl-acoes">
          <button id="inserirProximaEtapa" data-perm="prod.stage.item.add" class="btn-primary ctl-botao text-white">+ Inserir</button>
          <button id="limparProximaEtapa" data-perm="prod.stage.clear" class="btn-danger-light ctl-botao">Limpar Tudo</button>
        </div>
      </div>
        <div class="px-8 py-6 flex-1 min-h-0">
          <div class="bg-surface/40 rounded-xl border border-white/10 h-full min-h-0 flex flex-col overflow-hidden">
            <div class="table-scroll flex-1 min-h-0 overflow-auto modal-scroll">
              <table id="proximaEtapaTabela" class="w-full text-sm">
                <thead>
                  <tr class="border-b">
                    <th data-perm-col="col_etapa_item" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Item</th>
                    <th data-perm-col="col_etapa_qtd" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Quantidade</th>
                    <th data-perm-col="col_etapa_unidade" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Unidade</th>
                    <th data-perm-col="col_etapa_valor_un" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Valor unitário (R$)</th>
                    <th data-perm-col="col_etapa_valor_total" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Valor total (R$)</th>
                    <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Ações</th>
                  </tr>
                </thead>
                <tbody>
                </tbody>
              </table>
            </div>
            <div class="px-4 py-4 border-t border-white/10 bg-surface/20">
              <div class="flex justify-between items-center">
                <span class="text-gray-400 text-sm">Total do Processo:</span>
                <!-- totais -->
                <span id="proximaEtapaTotal" class="text-white font-semibold text-lg">R$ 0,00</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
