<div id="concluirPassoOverlay" class="fixed inset-0 z-[1300] bg-black/50 flex items-center justify-center p-4">
  <div class="max-w-xl w-full max-h-[90vh] glass-surface backdrop-blur-xl rounded-2xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade flex flex-col">
    <header class="grid grid-cols-3 items-center px-6 py-4 border-b border-white/10 flex-shrink-0">
      <button id="voltarConcluirPasso" type="button" class="btn-neutral px-4 py-2 rounded-lg text-white font-medium justify-self-start">← Voltar</button>
      <h2 class="text-lg font-semibold text-white text-center">Concluir Passo Planejado</h2>
      <span></span>
    </header>

    <form id="concluirPassoForm" class="p-6 space-y-5 overflow-y-auto modal-scroll">
      <div class="rounded-lg border border-white/10 bg-white/5 p-4">
        <p class="text-xs uppercase tracking-wide text-white/50 mb-1">Passo planejado</p>
        <p id="concluirPassoTexto" class="text-white font-medium"></p>
        <p id="concluirPassoData" class="text-xs text-white/50 mt-1"></p>
      </div>

      <div>
        <label for="concluirNota" class="block text-sm font-medium text-gray-300 mb-2">
          O que aconteceu? <span class="text-[var(--color-red)]">*</span>
        </label>
        <textarea id="concluirNota" rows="3" placeholder="Reunião realizada. Cliente aprovou o escopo e pediu a proposta formal."
                  class="w-full bg-input border border-inputBorder rounded-lg px-4 py-3 text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition resize-none"></textarea>
        <p class="mt-2 text-xs text-gray-400">
          Entra na timeline como <strong>Atividade realizada</strong>, guardando o passo combinado ao lado do que foi feito.
        </p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="concluirContato" class="block text-sm font-medium text-gray-300 mb-2">Com quem</label>
          <select id="concluirContato" class="w-full bg-input border border-inputBorder rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition select-arrow appearance-none">
            <option value="">Não especificado</option>
          </select>
        </div>
        <div>
          <label for="concluirData" class="block text-sm font-medium text-gray-300 mb-2">Quando</label>
          <input id="concluirData" type="datetime-local"
                 class="w-full bg-input border border-inputBorder rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
        </div>
      </div>

      <!-- Desfecho: as três opções são exclusivas -->
      <div class="pt-4 border-t border-white/10 space-y-3">
        <p class="text-sm font-medium text-gray-300">E agora, o que acontece com a prospecção?</p>

        <label class="flex items-start gap-3 cursor-pointer rounded-lg border border-white/10 p-3 hover:bg-white/5">
          <input type="radio" name="desfecho" value="nada" class="mt-1" checked />
          <span>
            <span class="block text-sm font-medium text-white">Continua onde está</span>
            <span class="block text-xs text-gray-400">Só registra a atividade, sem mexer no funil</span>
          </span>
        </label>

        <label class="flex items-start gap-3 cursor-pointer rounded-lg border border-white/10 p-3 hover:bg-white/5">
          <input type="radio" name="desfecho" value="etapa" data-perm="pros.stage.update" class="mt-1" />
          <span class="flex-1">
            <span class="block text-sm font-medium text-white">Avança no funil</span>
            <span class="block text-xs text-gray-400 mb-2">Move para outra etapa</span>
            <select id="concluirEtapa" disabled
                    class="w-full bg-input border border-inputBorder rounded-lg px-3 py-2 text-white text-sm focus:border-primary focus:ring-2 focus:ring-primary/50 transition select-arrow appearance-none"></select>
            <textarea id="concluirMotivoPerda" rows="2" placeholder="Motivo da perda"
                      class="hidden mt-2 w-full bg-input border border-inputBorder rounded-lg px-3 py-2 text-white text-sm placeholder-gray-400 resize-none"></textarea>
          </span>
        </label>

        <label class="flex items-start gap-3 cursor-pointer rounded-lg border border-white/10 p-3 hover:bg-white/5">
          <input type="radio" name="desfecho" value="converter" data-perm="pros.convert" class="mt-1" />
          <span>
            <span class="block text-sm font-medium text-white">Fechou — converter em cliente</span>
            <span class="block text-xs text-gray-400">Abre a conversão logo em seguida, para conferir os dados fiscais</span>
          </span>
        </label>
      </div>

      <div class="pt-4 border-t border-white/10 space-y-4">
        <p class="text-sm text-gray-400">Já combinou o próximo passo? Registre agora.</p>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="concluirProximoPasso" class="block text-sm font-medium text-gray-300 mb-2">Próximo passo</label>
            <input id="concluirProximoPasso" data-perm="pros.next.step" type="text" maxlength="255" placeholder="Enviar proposta revisada"
                   class="w-full bg-input border border-inputBorder rounded-lg px-4 py-3 text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
          <div>
            <label for="concluirProximoPassoData" class="block text-sm font-medium text-gray-300 mb-2">Para quando</label>
            <input id="concluirProximoPassoData" data-perm="pros.next.step" type="date"
                   class="w-full bg-input border border-inputBorder rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
        </div>
      </div>
    </form>

    <footer class="flex justify-end gap-4 px-6 py-4 border-t border-white/10 flex-shrink-0">
      <button id="cancelarConcluirPasso" type="button" class="btn-danger px-6 py-2 rounded-lg text-white font-medium">Cancelar</button>
      <button type="button" id="confirmarConcluirPasso" data-perm="pros.interaction.add" class="btn-success px-6 py-2 rounded-lg font-medium">Concluir</button>
    </footer>
  </div>
</div>
