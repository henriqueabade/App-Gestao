<div id="proximoPassoProspeccaoOverlay" class="fixed inset-0 z-[1300] bg-black/50 flex items-center justify-center p-4 ctl-padrao">
  <div class="max-w-lg w-full glass-surface backdrop-blur-xl rounded-2xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade">
    <header class="grid grid-cols-3 items-center px-6 py-4 border-b border-white/10">
      <button id="voltarProximoPasso" type="button" class="btn-neutral ctl-botao text-white justify-self-start">← Voltar</button>
      <h2 class="ctl-modal-titulo text-white text-center">Próximo Passo</h2>
      <span></span>
    </header>

    <form id="proximoPassoForm" class="p-6 space-y-4">
      <!--
        Só aparece quando já existe passo em aberto. Trocar o combinado sem
        dizer o que houve com o anterior faz a timeline perder o rastro: o
        passo some e ninguém sabe se foi feito, adiado ou abandonado.
      -->
      <div id="passoAnteriorBloco" class="hidden rounded-lg border border-white/10 bg-white/5 p-4">
        <p class="text-xs uppercase tracking-wide text-white/50 mb-1">Passo em aberto</p>
        <p id="passoAnteriorTexto" class="text-white font-medium"></p>
        <p id="passoAnteriorData" class="text-xs text-white/50 mt-1"></p>

        <label for="passoAnteriorNota" class="ctl-rotulo text-gray-300 mt-4">
          O que aconteceu com ele? <span class="text-[var(--color-red)]">*</span>
        </label>
        <textarea id="passoAnteriorNota" rows="3" placeholder="Liguei e o Ricardo pediu para retomar depois do conselho"
                  class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition resize-none"></textarea>
        <p class="mt-2 text-xs text-gray-400">
          Vira uma atividade na timeline, do tipo <strong>Atividade realizada</strong>.
        </p>
      </div>

      <div>
        <label for="proximoPassoTexto" class="ctl-rotulo text-gray-300">O que fazer agora</label>
        <input id="proximoPassoTexto" type="text" maxlength="255" placeholder="Ligar para confirmar o recebimento da proposta"
               class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
      </div>
      <div>
        <label for="proximoPassoData" class="ctl-rotulo text-gray-300">Para quando</label>
        <input id="proximoPassoData" type="date"
               class="w-full ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
      </div>
      <p class="text-xs text-gray-400">
        Deixe os dois campos em branco para encerrar sem agendar um novo passo.
      </p>
    </form>

    <footer class="ctl-acoes justify-end px-6 py-4 border-t border-white/10">
      <button id="cancelarProximoPasso" type="button" class="btn-danger ctl-botao text-white">Cancelar</button>
      <button type="button" id="salvarProximoPasso" data-perm="pros.next.step" class="btn-success ctl-botao">Salvar</button>
    </footer>
  </div>
</div>
