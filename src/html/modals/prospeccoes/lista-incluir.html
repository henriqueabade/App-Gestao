<!--
  "+" da Origem e do Tipo da interação: inclui um nome na lista
  (pros.lists.manage). O título e o exemplo vêm de window.prospeccaoListaAlvo
  (utils/prospeccao-listas.js). Script: js/modals/prospeccao-lista-incluir.js.
-->
<div id="incluirListaProspeccaoOverlay" class="fixed inset-0 z-[2000] bg-black/50 flex items-center justify-center p-4 ctl-padrao">
  <div class="max-w-sm w-full glass-surface backdrop-blur-xl rounded-2xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade">
    <header class="relative px-6 py-4 border-b border-white/10">
      <h2 id="incluirListaTitulo" class="ctl-modal-titulo text-center text-white">INSERIR</h2>
      <button id="fecharIncluirLista" type="button" class="btn-danger ctl-botao ctl-botao--pequeno ctl-botao--icone absolute right-4 top-4 text-white" aria-label="Fechar">✕</button>
    </header>
    <form id="incluirListaForm" class="p-6">
      <div class="relative">
        <input id="incluirListaNome" name="nome" type="text" maxlength="60" placeholder=" " required autocomplete="off" class="peer w-full ctl-campo bg-input border border-inputBorder text-white placeholder-transparent focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
        <label id="incluirListaRotulo" for="incluirListaNome" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-valid:top-0 peer-valid:-translate-y-full peer-valid:text-xs">Nome</label>
      </div>
      <p id="incluirListaExemplo" class="mt-3 text-xs text-gray-400"></p>
      <p id="incluirListaMensagem" class="mt-4 text-sm text-red-400 hidden" role="alert"></p>
    </form>
    <footer class="ctl-acoes justify-end px-6 py-4 border-t border-white/10">
      <button type="submit" data-perm="pros.lists.manage" form="incluirListaForm" class="btn-primary ctl-botao text-white active:scale-95">Inserir</button>
    </footer>
  </div>
</div>
