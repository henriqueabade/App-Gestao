<div id="campanhaProspeccaoOverlay" class="fixed inset-0 z-[1300] bg-black/50 flex items-center justify-center p-4 ctl-padrao">
  <div class="max-w-lg w-full glass-surface backdrop-blur-xl rounded-2xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade">
    <header class="grid grid-cols-3 items-center px-6 py-4 border-b border-white/10">
      <button id="voltarCampanhaProspeccao" type="button" class="btn-neutral ctl-botao text-white justify-self-start">← Voltar</button>
      <h2 id="tituloModalCampanha" class="ctl-modal-titulo text-white text-center">Nova Campanha</h2>
      <span></span>
    </header>

    <form id="campanhaProspeccaoForm" class="p-6 space-y-4">
      <div>
        <label for="campanhaNome" class="ctl-rotulo text-gray-300">Nome <span class="text-[var(--color-red)]">*</span></label>
        <input id="campanhaNome" type="text" maxlength="180" placeholder="Portfólio corporativo 2026"
               class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="campanhaCanal" class="ctl-rotulo text-gray-300">Canal</label>
          <input id="campanhaCanal" type="text" list="campanhaCanalSugestoes" placeholder="E-mail, WhatsApp..."
                 class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          <datalist id="campanhaCanalSugestoes">
            <option value="E-mail"></option>
            <option value="WhatsApp"></option>
            <option value="Redes Sociais"></option>
            <option value="Telefone"></option>
            <option value="Evento"></option>
          </datalist>
        </div>
        <div>
          <label for="campanhaStatus" class="ctl-rotulo text-gray-300">Status</label>
          <select id="campanhaStatus" class="w-full ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition select-arrow appearance-none"></select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="campanhaDataEnvio" class="ctl-rotulo text-gray-300">Data de envio</label>
          <input id="campanhaDataEnvio" type="date"
                 class="w-full ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
        </div>
        <div>
          <label for="campanhaResposta" class="ctl-rotulo text-gray-300">Resposta</label>
          <input id="campanhaResposta" type="text" maxlength="120" placeholder="Interessado, sem resposta..."
                 class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
        </div>
      </div>

      <div>
        <label for="campanhaObservacao" class="ctl-rotulo text-gray-300">Observação</label>
        <textarea id="campanhaObservacao" rows="3"
                  class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition resize-none"></textarea>
      </div>
    </form>

    <footer class="ctl-acoes justify-end px-6 py-4 border-t border-white/10">
      <button id="cancelarCampanhaProspeccao" type="button" class="btn-danger ctl-botao text-white">Cancelar</button>
      <button type="button" id="salvarCampanhaProspeccao" data-perm="pros.campaign.manage" class="btn-success ctl-botao">Salvar</button>
    </footer>
  </div>
</div>
