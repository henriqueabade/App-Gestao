<div id="contatoProspeccaoOverlay" class="fixed inset-0 z-[1300] bg-black/50 flex items-center justify-center p-4 ctl-padrao">
  <div class="max-w-md w-full glass-surface backdrop-blur-xl rounded-2xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade">
    <header class="grid grid-cols-3 items-center px-6 py-4 border-b border-white/10">
      <button id="voltarContatoProspeccao" type="button" class="btn-neutral ctl-botao text-white justify-self-start">← Voltar</button>
      <h2 id="contatoProspeccaoTitulo" class="ctl-modal-titulo text-white text-center">Novo Contato</h2>
      <span></span>
    </header>

    <form id="contatoProspeccaoForm" class="p-6 space-y-4">
      <div>
        <label for="contatoProsNome" class="ctl-rotulo text-gray-300">Nome <span class="text-[var(--color-red)]">*</span></label>
        <input id="contatoProsNome" name="nome" type="text" required placeholder="Nome completo"
               class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
      </div>

      <div>
        <label for="contatoProsCargo" class="ctl-rotulo text-gray-300">Cargo / função</label>
        <input id="contatoProsCargo" name="cargo" type="text" list="contatoProsCargoSugestoes" placeholder="Diretor, Comprador, Arquiteto..."
               class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
        <datalist id="contatoProsCargoSugestoes">
          <option value="Sócio-proprietário"></option>
          <option value="Diretor"></option>
          <option value="Gerente"></option>
          <option value="Comprador"></option>
          <option value="Arquiteto"></option>
          <option value="Financeiro"></option>
          <option value="Assistente"></option>
        </datalist>
      </div>

      <div>
        <label for="contatoProsEmail" class="ctl-rotulo text-gray-300">E-mail</label>
        <input id="contatoProsEmail" name="email" type="email" placeholder="nome@empresa.com.br"
               class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="contatoProsCelular" class="ctl-rotulo text-gray-300">Celular</label>
          <input id="contatoProsCelular" name="telefone_celular" type="text" inputmode="tel" placeholder="(11) 90000-0000"
                 class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
        </div>
        <div>
          <label for="contatoProsFixo" class="ctl-rotulo text-gray-300">Telefone fixo</label>
          <input id="contatoProsFixo" name="telefone_fixo" type="text" inputmode="tel" placeholder="(11) 3000-0000"
                 class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
        </div>
      </div>

      <div class="space-y-3 pt-2 border-t border-white/10">
        <label class="flex items-start gap-3 cursor-pointer">
          <input id="contatoProsDecisor" name="decisor" type="checkbox" class="w-4 h-4 mt-1" />
          <span>
            <span class="block text-sm font-medium text-white">É decisor</span>
            <span class="block text-xs text-gray-400">Tem poder para aprovar a compra</span>
          </span>
        </label>
        <label class="flex items-start gap-3 cursor-pointer">
          <input id="contatoProsPrincipal" name="principal" type="checkbox" class="w-4 h-4 mt-1" />
          <span>
            <span class="block text-sm font-medium text-white">Contato principal</span>
            <span class="block text-xs text-gray-400">Aparece na grade e é o interlocutor padrão. Só um por prospecção.</span>
          </span>
        </label>
      </div>

      <div>
        <label for="contatoProsObservacao" class="ctl-rotulo text-gray-300">Observação</label>
        <textarea id="contatoProsObservacao" name="observacao" rows="2" placeholder="Melhor horário para ligar, preferências..."
                  class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition resize-none"></textarea>
      </div>
    </form>

    <footer class="ctl-acoes justify-end px-6 py-4 border-t border-white/10">
      <button id="cancelarContatoProspeccao" type="button" class="btn-danger ctl-botao text-white">Cancelar</button>
      <button type="submit" form="contatoProspeccaoForm" id="salvarContatoProspeccao" class="btn-primary ctl-botao text-white">Registrar</button>
    </footer>
  </div>
</div>
