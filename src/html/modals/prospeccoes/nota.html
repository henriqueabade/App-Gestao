<div id="notaProspeccaoOverlay" class="fixed inset-0 z-[1300] bg-black/50 flex items-center justify-center p-4 ctl-padrao">
  <div class="max-w-lg w-full glass-surface backdrop-blur-xl rounded-2xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade">
    <header class="grid grid-cols-3 items-center px-6 py-4 border-b border-white/10">
      <button id="voltarNotaProspeccao" type="button" class="btn-neutral ctl-botao text-white justify-self-start">← Voltar</button>
      <h2 id="tituloModalNota" class="ctl-modal-titulo text-white text-center">Nova Nota</h2>
      <span></span>
    </header>

    <form id="notaProspeccaoForm" class="p-6 space-y-4">
      <div>
        <label for="notaTitulo" class="ctl-rotulo text-gray-300">Título</label>
        <input id="notaTitulo" type="text" maxlength="180" placeholder="Perfil do cliente, concorrência, condição..."
               class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
      </div>
      <div>
        <label for="notaConteudo" class="ctl-rotulo text-gray-300">Conteúdo <span class="text-[var(--color-red)]">*</span></label>
        <textarea id="notaConteudo" rows="8" placeholder="O que vale registrar sobre esta oportunidade..."
                  class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition resize-none"></textarea>
      </div>
    </form>

    <footer class="ctl-acoes justify-end px-6 py-4 border-t border-white/10">
      <button id="cancelarNotaProspeccao" type="button" class="btn-danger ctl-botao text-white">Cancelar</button>
      <button type="button" id="salvarNotaProspeccao" data-perm="pros.note.add" class="btn-success ctl-botao">Salvar</button>
    </footer>
  </div>
</div>
