<!--
  Registrar NF (Financeiro — Comissões e Produção). Modal médio.
  Etapa visual: os campos funcionam e a prévia das parcelas é calculada na
  tela, mas "Salvar NF" ainda avisa que a função está em implementação.
  Script compartilhado: src/js/modals/financeiro-modais.js.
-->
<div id="finRegistrarNfOverlay" data-fin-modal class="hidden fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4 pt-[4vw]" aria-hidden="true">
  <div role="dialog" aria-modal="true" aria-labelledby="finRegistrarNfTitulo" class="w-full max-w-3xl max-h-[90vh] glass-surface backdrop-blur-xl rounded-3xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade slide-in overflow-hidden flex flex-col">

    <header class="grid grid-cols-3 items-center px-8 py-5 border-b border-white/10 flex-shrink-0">
      <button type="button" data-fin-fechar class="btn-neutral px-4 py-2 rounded-lg text-white font-medium justify-self-start">← Voltar</button>
      <div class="text-center min-w-0">
        <h2 id="finRegistrarNfTitulo" class="text-lg font-semibold text-white truncate"><i class="fas fa-file-invoice mr-2" aria-hidden="true"></i>Registrar NF</h2>
        <p class="text-xs text-gray-300 truncate">Informe os dados de faturamento do pedido</p>
      </div>
      <span></span>
    </header>

    <div class="flex-1 overflow-y-auto modal-scroll">
      <section class="px-8 py-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="finNfPedido" class="block text-sm font-medium text-gray-300 mb-2">Pedido <span class="fin-obrigatorio">*</span></label>
            <input id="finNfPedido" type="text" list="finNfPedidosLista" placeholder="Digite o número do pedido" autocomplete="off"
                   class="w-full bg-input border border-inputBorder rounded-lg px-4 py-3 text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
            <datalist id="finNfPedidosLista"></datalist>
          </div>
          <div>
            <label for="finNfCliente" class="block text-sm font-medium text-gray-300 mb-2">Cliente</label>
            <input id="finNfCliente" type="text" readonly placeholder="Preenchido pelo pedido"
                   class="w-full bg-input border border-inputBorder rounded-lg px-4 py-3 text-white placeholder-gray-400 fin-somente-leitura" />
          </div>

          <div>
            <label for="finNfNumero" class="block text-sm font-medium text-gray-300 mb-2">Nº da NF <span class="fin-obrigatorio">*</span></label>
            <input id="finNfNumero" type="text" inputmode="numeric" placeholder="Ex.: 18842" autocomplete="off"
                   class="w-full bg-input border border-inputBorder rounded-lg px-4 py-3 text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
          <div>
            <label for="finNfEmissao" class="block text-sm font-medium text-gray-300 mb-2">Data de emissão <span class="fin-obrigatorio">*</span></label>
            <input id="finNfEmissao" type="date"
                   class="w-full bg-input border border-inputBorder rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>

          <div>
            <label for="finNfValor" class="block text-sm font-medium text-gray-300 mb-2">Valor faturado <span class="fin-obrigatorio">*</span></label>
            <input id="finNfValor" type="text" inputmode="decimal" placeholder="R$ 0,00" autocomplete="off"
                   class="w-full bg-input border border-inputBorder rounded-lg px-4 py-3 text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
          <div>
            <label for="finNfCondicao" class="block text-sm font-medium text-gray-300 mb-2">Condição de pagamento <span class="fin-obrigatorio">*</span></label>
            <select id="finNfCondicao" class="w-full appearance-none select-arrow bg-input border border-inputBorder rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition">
              <option value="">Selecione</option>
              <option value="0">À vista</option>
              <option value="30">30 dias</option>
              <option value="30/60">30 / 60</option>
              <option value="30/60/90">30 / 60 / 90</option>
              <option value="28/56/84/112">28 / 56 / 84 / 112</option>
              <option value="30/60/90/120/150/180">30 / 60 / 90 / 120 / 150 / 180</option>
            </select>
          </div>

          <div class="md:col-span-2">
            <label for="finNfObservacoes" class="block text-sm font-medium text-gray-300 mb-2">Observações</label>
            <textarea id="finNfObservacoes" rows="3" placeholder="Opcional"
                      class="w-full bg-input border border-inputBorder rounded-lg px-4 py-3 text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition"></textarea>
          </div>
        </div>

        <!-- Conferência antes de salvar: aparece assim que valor e condição existem. -->
        <div id="finNfParcelas" class="hidden glass-surface rounded-xl border border-white/10 overflow-hidden">
          <p class="px-4 py-3 text-xs text-gray-400 border-b border-white/10">Parcelas que serão geradas</p>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr>
                  <th class="px-4 py-3 text-left text-xs">Parcela</th>
                  <th class="px-4 py-3 text-right text-xs">Prazo</th>
                  <th class="px-4 py-3 text-left text-xs">Vencimento</th>
                  <th class="px-4 py-3 text-right text-xs">Valor</th>
                </tr>
              </thead>
              <tbody id="finNfParcelasCorpo" class="divide-y divide-white/10"></tbody>
            </table>
          </div>
        </div>

        <div id="finNfMensagem" class="hidden text-sm" role="alert"></div>
      </section>
    </div>

    <footer class="px-8 py-5 border-t border-white/10 flex items-center justify-end gap-4 flex-shrink-0">
      <button type="button" data-fin-fechar class="btn-danger px-6 py-2 rounded-lg text-white font-medium min-w-[120px]">Cancelar</button>
      <button type="button" data-fin-principal="Salvar NF" class="btn-success px-6 py-2 rounded-lg font-medium min-w-[120px]">Salvar NF</button>
    </footer>
  </div>
</div>
