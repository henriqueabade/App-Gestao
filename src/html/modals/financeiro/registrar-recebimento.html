<!--
  Registrar recebimento (liquidação de parcela). Modal médio, REAL: escolhe
  uma parcela em aberto (GET /api/cobranca/recebimentos?visao=abertas) e
  grava por POST /api/cobranca/recebimentos. Parcela com boleto em aberto no
  BB: a tela avisa e, confirmado, o boleto é baixado como quitado por fora.
  Boleto pago no banco não entra por aqui: chega pelo aviso do BB ou por
  "Conciliar com o BB". A competência é o mês do recebimento.
  Script compartilhado: src/js/modals/financeiro-modais.js.
-->
<div id="finRegistrarRecebimentoOverlay" data-fin-modal class="hidden fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4 pt-[4vw] ctl-padrao" aria-hidden="true">
  <div role="dialog" aria-modal="true" aria-labelledby="finRecebimentoTitulo" class="w-full max-w-3xl max-h-[90vh] glass-surface backdrop-blur-xl rounded-3xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade slide-in overflow-hidden flex flex-col">

    <header class="grid grid-cols-3 items-center px-8 py-5 border-b border-white/10 flex-shrink-0">
      <button type="button" data-fin-fechar class="btn-neutral ctl-botao text-white justify-self-start">← Voltar</button>
      <h2 id="finRecebimentoTitulo" class="ctl-modal-titulo text-white text-center truncate"><i class="fas fa-money-bill-wave mr-2" aria-hidden="true"></i>Registrar recebimento</h2>
      <span id="finRecebimentoContexto" class="text-sm text-gray-300 justify-self-end truncate"></span>
    </header>

    <div class="flex-1 overflow-y-auto modal-scroll">
      <section class="px-8 py-6 space-y-6">
        <div id="finRecebimentoCarregando" class="text-sm text-gray-400">Lendo as parcelas em aberto…</div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="md:col-span-1">
            <label for="finRecebimentoBusca" class="ctl-rotulo text-gray-300">Procurar</label>
            <input id="finRecebimentoBusca" type="text" placeholder="Pedido, cliente ou NF" autocomplete="off"
                   class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
          <div class="md:col-span-2">
            <label for="finRecebimentoParcela" class="ctl-rotulo text-gray-300">Parcela <span class="fin-obrigatorio">*</span></label>
            <select id="finRecebimentoParcela" class="w-full appearance-none select-arrow ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition"></select>
          </div>
        </div>

        <!-- Resumo do pedido: o que NÃO se altera aqui. -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="glass-surface rounded-xl px-4 py-3 border border-white/10">
            <p class="text-xs text-gray-400 mb-1">Cliente</p>
            <p id="finRecebimentoCliente" class="text-sm text-white truncate">—</p>
          </div>
          <div class="glass-surface rounded-xl px-4 py-3 border border-white/10">
            <p class="text-xs text-gray-400 mb-1">Pedido</p>
            <p id="finRecebimentoPedido" class="text-sm text-white">—</p>
          </div>
          <div class="glass-surface rounded-xl px-4 py-3 border border-white/10">
            <p class="text-xs text-gray-400 mb-1">NF</p>
            <p id="finRecebimentoNf" class="text-sm text-white">—</p>
          </div>
        </div>

        <div id="finRecebimentoAvisoBoleto" class="hidden fin-aviso" role="status"></div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="finRecebimentoData" class="ctl-rotulo text-gray-300">Data do recebimento <span class="fin-obrigatorio">*</span></label>
            <input id="finRecebimentoData" type="date"
                   class="w-full ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
          <div>
            <label for="finRecebimentoValor" class="ctl-rotulo text-gray-300">Valor recebido <span class="fin-obrigatorio">*</span></label>
            <input id="finRecebimentoValor" type="text" inputmode="decimal" placeholder="R$ 0,00" autocomplete="off" data-numeric="false"
                   class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
          <div>
            <label for="finRecebimentoForma" class="ctl-rotulo text-gray-300">Como foi recebido <span class="fin-obrigatorio">*</span></label>
            <select id="finRecebimentoForma" class="w-full appearance-none select-arrow ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition">
              <option value="">Selecione</option>
              <option value="Pix">Pix</option>
              <option value="Transferência">Transferência</option>
              <option value="Depósito">Depósito</option>
              <option value="Dinheiro">Dinheiro</option>
              <option value="Cheque">Cheque</option>
              <option value="Cartão de crédito">Cartão de crédito</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div>
            <label for="finRecebimentoObservacoes" class="ctl-rotulo text-gray-300">Observações</label>
            <input id="finRecebimentoObservacoes" type="text" maxlength="500" placeholder="Opcional" autocomplete="off"
                   class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
        </div>

        <!-- Informativo: o que este recebimento grava. -->
        <div class="glass-surface rounded-xl border border-white/10 divide-y divide-white/10">
          <div class="flex items-center justify-between px-4 py-3">
            <span class="text-sm text-gray-400">A receber da parcela</span>
            <span id="finRecebimentoDevido" class="text-sm text-white">—</span>
          </div>
          <div class="flex items-center justify-between px-4 py-3">
            <span class="text-sm text-gray-400">Valor recebido</span>
            <span id="finRecebimentoLiquido" class="text-sm text-white">—</span>
          </div>
          <div class="flex items-center justify-between px-4 py-3">
            <span id="finRecebimentoDiferencaRotulo" class="text-sm text-gray-400">Diferença</span>
            <span id="finRecebimentoDiferenca" class="text-sm text-white">—</span>
          </div>
          <!-- Fase G: a comissão que este recebimento gera (sobre o valor líquido da parcela). Some sem financeiro.comissao.view. -->
          <div class="flex items-center justify-between px-4 py-3" data-perm-hide="financeiro.comissao.view">
            <span class="text-sm text-gray-400">Valor líquido da parcela</span>
            <span id="finRecebimentoBase" class="text-sm text-white">—</span>
          </div>
          <div class="flex items-center justify-between px-4 py-3" data-perm-hide="financeiro.comissao.view">
            <span class="text-sm text-gray-400">CMS a gerar</span>
            <span id="finRecebimentoCms" class="text-sm text-white">—</span>
          </div>
          <div class="flex items-center justify-between px-4 py-3" data-perm-hide="financeiro.comissao.view">
            <span class="text-sm text-gray-400">Royalty</span>
            <span id="finRecebimentoRoyalty" class="text-sm text-white">—</span>
          </div>
          <div class="flex items-center justify-between px-4 py-4">
            <span class="text-base font-medium text-white">Competência</span>
            <span id="finRecebimentoCompetencia" class="text-base font-semibold" style="color: var(--color-primary-light)">—</span>
          </div>
        </div>

        <div id="finRecebimentoMensagem" class="hidden text-sm" role="alert"></div>
      </section>
    </div>

    <footer class="px-8 py-5 border-t border-white/10 ctl-acoes justify-end flex-shrink-0">
      <button type="button" data-fin-fechar class="btn-danger ctl-botao text-white min-w-[120px]">Cancelar</button>
      <button id="finRecebimentoRegistrar" type="button" data-perm="financeiro.recebimento.registrar" class="btn-success ctl-botao min-w-[120px]">Registrar recebimento</button>
    </footer>
  </div>
</div>
