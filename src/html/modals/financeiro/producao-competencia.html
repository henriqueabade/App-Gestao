<!--
  Produção da competência: tudo que entra (ou entrou) no fechamento
  produtivo. Modal extra grande. Dados: GET /api/financeiro/producao?competencia=
  (prévia enquanto aberta; o congelado depois de fechada). Os indicadores
  por setor são montados na hora (setores são editáveis). "Fechar
  competência" abre o fechamento por cima.
  Script: src/js/modals/financeiro-modais.js (montarProducaoCompetencia).
-->
<div id="finProducaoCompetenciaOverlay" data-fin-modal class="hidden fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4 pt-[4vw] ctl-padrao" aria-hidden="true">
  <div role="dialog" aria-modal="true" aria-labelledby="finProdCompTitulo" class="w-full max-w-7xl h-[90vh] glass-surface backdrop-blur-xl rounded-3xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade slide-in overflow-hidden flex flex-col">

    <header class="grid grid-cols-3 items-center px-8 py-5 border-b border-white/10 flex-shrink-0">
      <button type="button" data-fin-fechar class="btn-neutral ctl-botao text-white justify-self-start">← Voltar</button>
      <div class="text-center min-w-0">
        <h2 id="finProdCompTitulo" class="ctl-modal-titulo text-white truncate"><i class="fas fa-industry mr-2" aria-hidden="true"></i>Produção — <span id="finProdCompCompetencia">—</span></h2>
        <p id="finProdCompSubtitulo" class="text-xs text-gray-300 truncate">Peças finalizadas que entram no fechamento produtivo</p>
      </div>
      <span id="finProdCompStatus" class="badge-warning px-3 py-1 rounded-full text-xs font-medium justify-self-end">Em aberto</span>
    </header>

    <div class="flex-1 min-h-0 overflow-y-auto modal-scroll">
      <section class="px-8 py-6 space-y-6">
        <div class="flex flex-wrap items-end gap-4">
          <div>
            <label for="finProdCompMesMes" class="ctl-rotulo text-gray-300">Competência</label>
            <!-- Competência: mês, ano (também dá para digitar) e a lupa que entra no mês. -->
            <div class="fin-competencia-campo fin-competencia-campo--modal" data-competencia>
              <select id="finProdCompMesMes" data-competencia-mes aria-label="Mês" class="fin-competencia-campo__mes w-full appearance-none select-arrow ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition"></select>
              <input id="finProdCompMesAno" data-competencia-ano type="number" inputmode="numeric" step="1" aria-label="Ano" class="fin-competencia-campo__ano ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
              <button id="finProdCompMesIr" data-competencia-ir type="button" class="btn-neutral ctl-botao ctl-botao--icone fin-competencia-campo__ir text-white" title="Ver esta competência" aria-label="Ver esta competência"><i class="fas fa-search" aria-hidden="true"></i></button>
              <input type="hidden" id="finProdCompMes" />
            </div>
          </div>
          <p id="finProdCompInfo" class="text-xs text-gray-400 pb-3"></p>
        </div>

        <p id="finProdCompCarregando" class="hidden fin-vazio">Carregando dados...</p>
        <div id="finProdCompMensagem" class="hidden text-sm" role="alert"></div>

        <div id="finProdCompIndicadores" class="fin-indicadores fin-indicadores--5"></div>

        <div class="fin-filtros fin-filtros--4">
          <div>
            <label for="finProdCompSetor" class="ctl-rotulo text-gray-300">Processo</label>
            <select id="finProdCompSetor" class="w-full appearance-none select-arrow ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition">
              <option value="">Todos</option>
            </select>
          </div>
          <div>
            <label for="finProdCompPedido" class="ctl-rotulo text-gray-300">Pedido</label>
            <input id="finProdCompPedido" type="text" placeholder="Número" autocomplete="off"
                   class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
          <div>
            <label for="finProdCompProduto" class="ctl-rotulo text-gray-300">Produto</label>
            <input id="finProdCompProduto" type="text" placeholder="Código ou nome" autocomplete="off"
                   class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
          <div>
            <label for="finProdCompItemStatus" class="ctl-rotulo text-gray-300">Status do item</label>
            <select id="finProdCompItemStatus" class="w-full appearance-none select-arrow ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition">
              <option value="">Todos</option>
              <option value="Finalizado">Finalizado</option>
              <option value="Parcial">Parcial</option>
            </select>
          </div>
        </div>

        <div class="fin-tabela glass-surface rounded-xl border border-white/10">
          <table class="w-full text-sm">
            <thead>
              <tr>
                <th class="px-4 py-3 text-left text-xs">Pedido</th>
                <th class="px-4 py-3 text-left text-xs">Data</th>
                <th class="px-4 py-3 text-left text-xs">Produto</th>
                <th class="px-4 py-3 text-left text-xs">Processo</th>
                <th class="px-4 py-3 text-right text-xs">Quantidade</th>
                <th class="px-4 py-3 text-right text-xs">Valor unitário</th>
                <th class="px-4 py-3 text-right text-xs">Total</th>
                <th class="px-4 py-3 text-left text-xs">Status do item</th>
              </tr>
            </thead>
            <tbody id="finProdCompCorpo" class="divide-y divide-white/10"></tbody>
            <tfoot>
              <tr class="fin-totais">
                <td class="px-4 py-3" colspan="6">Total da competência</td>
                <td class="px-4 py-3 text-right" id="finProdCompRodape">—</td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <p id="finProdCompVazio" class="hidden fin-vazio">Nenhuma peça finalizada nesta competência.</p>
        <div id="finProdCompBloqueios" class="hidden fin-aviso" role="status">
          <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>
          <span id="finProdCompBloqueiosTexto"></span>
        </div>
      </section>
    </div>

    <footer class="px-8 py-5 border-t border-white/10 ctl-acoes justify-end flex-shrink-0">
      <button type="button" data-fin-fechar class="btn-danger ctl-botao text-white min-w-[120px]">Fechar</button>
      <button type="button" id="finProdCompRelatorio" class="btn-secondary ctl-botao text-white min-w-[140px]">Ver relatório</button>
      <button type="button" id="finProdCompFechar" data-perm="financeiro.competencia.fechar" class="btn-success ctl-botao min-w-[160px]">Fechar competência</button>
    </footer>
  </div>
</div>
