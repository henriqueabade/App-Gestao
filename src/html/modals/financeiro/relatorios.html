<!--
  Central de relatórios do módulo. Modal médio, com abas no padrão da casa
  (Clientes / Relatórios). "Gerar relatório" abre a folha de conferência
  (Visualizar) ou salva direto em PDF ou planilha (Excel, CSV), com as
  linhas de GET /api/financeiro/relatorios/:chave.
  Script: src/js/modals/financeiro-modais.js (montarRelatorios).
-->
<div id="finRelatoriosOverlay" data-fin-modal class="hidden fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4 pt-[4vw] ctl-padrao" aria-hidden="true">
  <div role="dialog" aria-modal="true" aria-labelledby="finRelatoriosTitulo" class="w-full max-w-3xl h-[90vh] glass-surface backdrop-blur-xl rounded-3xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade slide-in overflow-hidden flex flex-col">

    <header class="grid grid-cols-3 items-center px-8 py-5 border-b border-white/10 flex-shrink-0">
      <button type="button" data-fin-fechar class="btn-neutral ctl-botao text-white justify-self-start">← Voltar</button>
      <h2 id="finRelatoriosTitulo" class="ctl-modal-titulo text-white text-center truncate"><i class="fas fa-chart-line mr-2" aria-hidden="true"></i>Relatórios</h2>
      <span></span>
    </header>

    <nav class="px-8 border-b border-white/10 flex-shrink-0" role="tablist">
      <div class="flex gap-8 overflow-x-auto scrollbar-hide">
        <button id="finRelTabComissoes" type="button" role="tab" aria-selected="true" aria-controls="finRelPainelComissoes" data-fin-aba="comissoes" class="py-4 px-2 text-sm font-medium border-b-2 tab-active whitespace-nowrap transition">Comissões</button>
        <button id="finRelTabProducao" type="button" role="tab" aria-selected="false" aria-controls="finRelPainelProducao" data-fin-aba="producao" class="py-4 px-2 text-sm font-medium text-gray-400 border-b-2 border-transparent hover:text-white transition whitespace-nowrap">Produção</button>
      </div>
    </nav>

    <div class="flex-1 overflow-y-auto modal-scroll">
      <section class="px-8 py-6 space-y-6">
        <div id="finRelPainelComissoes" data-fin-painel="comissoes" role="tabpanel" aria-labelledby="finRelTabComissoes" class="fin-lista-opcoes">
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="previsao-comissoes" checked style="accent-color: var(--color-primary)" /><span class="text-white">Previsão de comissões</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="comissoes-atrasadas" style="accent-color: var(--color-primary)" /><span class="text-white">Comissões atrasadas</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="comissoes-apuradas" style="accent-color: var(--color-primary)" /><span class="text-white">Comissões apuradas no mês</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="ajustes-anteriores" style="accent-color: var(--color-primary)" /><span class="text-white">Ajustes de períodos anteriores</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="comissoes-nao-realizadas" style="accent-color: var(--color-primary)" /><span class="text-white">Comissões não realizadas</span></label>
        </div>

        <div id="finRelPainelProducao" data-fin-painel="producao" role="tabpanel" aria-labelledby="finRelTabProducao" class="hidden fin-lista-opcoes">
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="producao-competencia" style="accent-color: var(--color-primary)" /><span class="text-white">Produção da competência</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="pagamento-marcenaria" style="accent-color: var(--color-primary)" /><span class="text-white">Pagamento marcenaria</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="pagamento-acabamento" style="accent-color: var(--color-primary)" /><span class="text-white">Pagamento acabamento</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="pagamento-montagem" style="accent-color: var(--color-primary)" /><span class="text-white">Pagamento montagem</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="pagamento-embalagem" style="accent-color: var(--color-primary)" /><span class="text-white">Pagamento embalagem</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="producao-por-pedido" style="accent-color: var(--color-primary)" /><span class="text-white">Produção por pedido</span></label>
        </div>

        <!-- Filtro: por competência (padrão) ou por período -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="finRelFiltro" class="ctl-rotulo text-gray-300">Filtrar por</label>
            <select id="finRelFiltro" class="w-full appearance-none select-arrow ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition">
              <option value="competencia">Competência</option>
              <option value="periodo">Período</option>
            </select>
          </div>
          <div id="finRelCompetenciaBloco">
            <label for="finRelCompetenciaMes" class="ctl-rotulo text-gray-300">Competência</label>
            <!-- Competência: mês, ano (também dá para digitar) e a lupa que entra no mês. -->
            <div class="fin-competencia-campo fin-competencia-campo--modal" data-competencia>
              <select id="finRelCompetenciaMes" data-competencia-mes aria-label="Mês" class="fin-competencia-campo__mes w-full appearance-none select-arrow ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition"></select>
              <input id="finRelCompetenciaAno" data-competencia-ano type="number" inputmode="numeric" step="1" aria-label="Ano" class="fin-competencia-campo__ano ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
              <button id="finRelCompetenciaIr" data-competencia-ir type="button" class="btn-neutral ctl-botao ctl-botao--icone fin-competencia-campo__ir text-white" title="Ver esta competência" aria-label="Ver esta competência"><i class="fas fa-search" aria-hidden="true"></i></button>
              <input type="hidden" id="finRelCompetencia" />
            </div>
          </div>
          <div id="finRelPeriodoBloco" class="hidden md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label for="finRelPeriodoInicio" class="ctl-rotulo text-gray-300">De</label>
              <input id="finRelPeriodoInicio" type="date" class="w-full ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
            </div>
            <div>
              <label for="finRelPeriodoFim" class="ctl-rotulo text-gray-300">Até</label>
              <input id="finRelPeriodoFim" type="date" class="w-full ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
            </div>
          </div>
        </div>

        <div role="radiogroup" aria-labelledby="finRelFormatoTitulo">
          <p id="finRelFormatoTitulo" class="ctl-rotulo text-gray-300">Formato</p>
          <div class="fin-segmento">
            <label><input type="radio" name="finRelFormato" value="visualizar" checked /><span><i class="fas fa-eye mr-2" aria-hidden="true"></i>Visualizar</span></label>
            <label><input type="radio" name="finRelFormato" value="pdf" /><span><i class="fas fa-file-pdf mr-2" aria-hidden="true"></i>PDF</span></label>
            <label><input type="radio" name="finRelFormato" value="excel" /><span><i class="fas fa-file-excel mr-2" aria-hidden="true"></i>Excel</span></label>
          </div>
        </div>

        <div id="finRelatoriosMensagem" class="hidden text-sm" role="alert"></div>
      </section>
    </div>

    <footer class="px-8 py-5 border-t border-white/10 ctl-acoes justify-end flex-shrink-0">
      <button type="button" data-fin-fechar class="btn-danger ctl-botao text-white min-w-[120px]">Cancelar</button>
      <button id="finRelGerar" type="button" class="btn-success ctl-botao min-w-[120px]">Gerar relatório</button>
    </footer>
  </div>
</div>
