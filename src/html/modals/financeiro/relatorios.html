<!--
  Central de relatórios do módulo. Modal médio, com abas no padrão da casa
  (Clientes / Relatórios). Etapa visual: "Gerar relatório" ainda avisa que
  está em implementação. Script: src/js/modals/financeiro-modais.js.
-->
<div id="finRelatoriosOverlay" class="hidden fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4 pt-[4vw]" aria-hidden="true">
  <div role="dialog" aria-modal="true" aria-labelledby="finRelatoriosTitulo" class="w-full max-w-3xl max-h-[90vh] glass-surface backdrop-blur-xl rounded-3xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade slide-in overflow-hidden flex flex-col">

    <header class="grid grid-cols-3 items-center px-8 py-5 border-b border-white/10 flex-shrink-0">
      <button type="button" data-fin-fechar class="btn-neutral px-4 py-2 rounded-lg text-white font-medium justify-self-start">← Voltar</button>
      <h2 id="finRelatoriosTitulo" class="text-lg font-semibold text-white text-center truncate"><i class="fas fa-chart-line mr-2" aria-hidden="true"></i>Relatórios</h2>
      <span></span>
    </header>

    <nav class="px-8 border-b border-white/10 flex-shrink-0" role="tablist">
      <div class="flex gap-8 overflow-x-auto scrollbar-hide">
        <button id="finRelTabComissoes" type="button" role="tab" aria-selected="true" aria-controls="finRelPainelComissoes" data-fin-aba="comissoes" class="py-4 px-2 text-sm font-medium border-b-2 tab-active whitespace-nowrap transition">Comissões</button>
        <button id="finRelTabProducao" type="button" role="tab" aria-selected="false" aria-controls="finRelPainelProducao" data-fin-aba="producao" class="py-4 px-2 text-sm font-medium text-gray-400 border-b-2 border-transparent hover:text-white transition whitespace-nowrap">Produção</button>
      </div>
    </nav>

    <div class="flex-1 overflow-y-auto modal-scroll">
      <section class="px-8 py-6 space-y-6">
        <div id="finRelPainelComissoes" role="tabpanel" aria-labelledby="finRelTabComissoes" class="fin-lista-opcoes">
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="previsao-comissoes" checked style="accent-color: var(--color-primary)" /><span class="text-white">Previsão de comissões</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="comissoes-atrasadas" style="accent-color: var(--color-primary)" /><span class="text-white">Comissões atrasadas</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="comissoes-apuradas" style="accent-color: var(--color-primary)" /><span class="text-white">Comissões apuradas no mês</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="ajustes-anteriores" style="accent-color: var(--color-primary)" /><span class="text-white">Ajustes de períodos anteriores</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="comissoes-nao-realizadas" style="accent-color: var(--color-primary)" /><span class="text-white">Comissões não realizadas</span></label>
        </div>

        <div id="finRelPainelProducao" role="tabpanel" aria-labelledby="finRelTabProducao" class="hidden fin-lista-opcoes">
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="producao-competencia" style="accent-color: var(--color-primary)" /><span class="text-white">Produção da competência</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="pagamento-pintura" style="accent-color: var(--color-primary)" /><span class="text-white">Pagamento pintura</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="pagamento-marcenaria" style="accent-color: var(--color-primary)" /><span class="text-white">Pagamento marcenaria</span></label>
          <label class="fin-opcao"><input type="radio" name="finRelatorio" value="producao-por-pedido" style="accent-color: var(--color-primary)" /><span class="text-white">Produção por pedido</span></label>
        </div>

        <!-- Filtro: por competência (padrão) ou por período -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="finRelFiltro" class="block text-sm font-medium text-gray-300 mb-2">Filtrar por</label>
            <select id="finRelFiltro" class="w-full appearance-none select-arrow bg-input border border-inputBorder rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition">
              <option value="competencia">Competência</option>
              <option value="periodo">Período</option>
            </select>
          </div>
          <div id="finRelCompetenciaBloco">
            <label for="finRelCompetencia" class="block text-sm font-medium text-gray-300 mb-2">Competência</label>
            <select id="finRelCompetencia" class="w-full appearance-none select-arrow bg-input border border-inputBorder rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition"></select>
          </div>
          <div id="finRelPeriodoBloco" class="hidden md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label for="finRelPeriodoInicio" class="block text-sm font-medium text-gray-300 mb-2">De</label>
              <input id="finRelPeriodoInicio" type="date" class="w-full bg-input border border-inputBorder rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
            </div>
            <div>
              <label for="finRelPeriodoFim" class="block text-sm font-medium text-gray-300 mb-2">Até</label>
              <input id="finRelPeriodoFim" type="date" class="w-full bg-input border border-inputBorder rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
            </div>
          </div>
        </div>

        <div role="radiogroup" aria-labelledby="finRelFormatoTitulo">
          <p id="finRelFormatoTitulo" class="block text-sm font-medium text-gray-300 mb-2">Formato</p>
          <div class="fin-segmento">
            <label><input type="radio" name="finRelFormato" value="visualizar" checked /><span><i class="fas fa-eye mr-2" aria-hidden="true"></i>Visualizar</span></label>
            <label><input type="radio" name="finRelFormato" value="pdf" /><span><i class="fas fa-file-pdf mr-2" aria-hidden="true"></i>PDF</span></label>
            <label><input type="radio" name="finRelFormato" value="excel" /><span><i class="fas fa-file-excel mr-2" aria-hidden="true"></i>Excel</span></label>
          </div>
        </div>

        <div id="finRelatoriosMensagem" class="hidden text-sm" role="alert"></div>
      </section>
    </div>

    <footer class="px-8 py-5 border-t border-white/10 flex items-center justify-end gap-4 flex-shrink-0">
      <button type="button" data-fin-fechar class="btn-danger px-6 py-2 rounded-lg text-white font-medium min-w-[120px]">Cancelar</button>
      <button type="button" data-fin-principal="Gerar relatório" class="btn-success px-6 py-2 rounded-lg font-medium min-w-[120px]">Gerar relatório</button>
    </footer>
  </div>
</div>
