<!--
  Confirmar pagamento de uma competência fechada (comissão ou produção).
  Modal pequeno. Os fechamentos vêm de GET /api/financeiro/fechamentos?tipo=;
  grava por POST /api/financeiro/pagamentos (financeiro.pagamento.confirmar).
  Script: src/js/modals/financeiro-modais.js (montarConfirmarPagamento).
-->
<div id="finConfirmarPagamentoOverlay" data-fin-modal class="hidden fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4 pt-[4vw] ctl-padrao" aria-hidden="true">
  <div role="dialog" aria-modal="true" aria-labelledby="finPagamentoTitulo" class="w-full max-w-3xl max-h-[90vh] glass-surface backdrop-blur-xl rounded-3xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade slide-in overflow-hidden flex flex-col">

    <header class="grid grid-cols-3 items-center px-8 py-5 border-b border-white/10 flex-shrink-0">
      <button type="button" data-fin-fechar class="btn-neutral ctl-botao text-white justify-self-start">← Voltar</button>
      <h2 id="finPagamentoTitulo" class="ctl-modal-titulo text-white text-center truncate"><i class="fas fa-check-circle mr-2" aria-hidden="true"></i>Confirmar pagamento</h2>
      <span id="finPagamentoSituacao" class="badge-neutral px-3 py-1 rounded-full text-xs font-medium justify-self-end">—</span>
    </header>

    <div class="flex-1 overflow-y-auto modal-scroll">
      <section class="px-8 py-6 space-y-6">
        <div role="radiogroup" aria-labelledby="finPagamentoTipoTitulo">
          <p id="finPagamentoTipoTitulo" class="ctl-rotulo text-gray-300">Tipo</p>
          <div class="grid grid-cols-2 gap-4">
            <label class="fin-opcao">
              <input type="radio" name="finPagamentoTipo" value="comissao" checked style="accent-color: var(--color-primary)" />
              <span class="text-white font-medium">Comissão</span>
            </label>
            <label class="fin-opcao">
              <input type="radio" name="finPagamentoTipo" value="producao" style="accent-color: var(--color-primary)" />
              <span class="text-white font-medium">Produção</span>
            </label>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="finPagamentoCompetenciaMes" class="ctl-rotulo text-gray-300">Competência <span class="fin-obrigatorio">*</span></label>
            <!-- Competência: mês, ano (também dá para digitar) e a lupa que entra no mês. -->
            <div class="fin-competencia-campo fin-competencia-campo--modal" data-competencia>
              <select id="finPagamentoCompetenciaMes" data-competencia-mes aria-label="Mês" class="fin-competencia-campo__mes w-full appearance-none select-arrow ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition"></select>
              <input id="finPagamentoCompetenciaAno" data-competencia-ano type="number" inputmode="numeric" step="1" aria-label="Ano" class="fin-competencia-campo__ano ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
              <button id="finPagamentoCompetenciaIr" data-competencia-ir type="button" class="btn-neutral ctl-botao ctl-botao--icone fin-competencia-campo__ir text-white" title="Ver esta competência" aria-label="Ver esta competência"><i class="fas fa-search" aria-hidden="true"></i></button>
              <input type="hidden" id="finPagamentoCompetencia" />
            </div>
          </div>
          <div>
            <label for="finPagamentoValor" class="ctl-rotulo text-gray-300">Valor</label>
            <input id="finPagamentoValor" type="text" readonly value="—"
                   class="w-full ctl-campo bg-input border border-inputBorder text-white fin-somente-leitura" />
          </div>
          <div class="md:col-span-2">
            <p id="finPagamentoInfo" class="text-xs text-gray-400"></p>
          </div>

          <!--
            Comissão: dá para pagar tudo de uma vez ou escolher quem recebe
            (CMS e Royalty de cada pessoa, em linhas separadas). Cada linha vira
            um pagamento próprio; o que sobrar continua a pagar.
          -->
          <div id="finPagamentoQuemRecebe" class="hidden md:col-span-2 fin-benef">
            <div class="fin-benef__topo">
              <span class="fin-benef__titulo">Quem recebe</span>
              <span id="finPagamentoSelecao" class="fin-benef__total">—</span>
            </div>
            <label class="fin-opcao mb-2">
              <input id="finPagamentoTudo" type="checkbox" checked style="accent-color: var(--color-primary)" />
              <span class="text-white font-medium">Pagar tudo o que falta</span>
            </label>
            <ul id="finPagamentoBeneficiarios" class="fin-benef__lista" role="group" aria-label="Beneficiários da competência"></ul>
            <div id="finPagamentoLegenda" class="fin-benef__legenda"></div>
          </div>
          <div>
            <label for="finPagamentoData" class="ctl-rotulo text-gray-300">Data do pagamento <span class="fin-obrigatorio">*</span></label>
            <input id="finPagamentoData" type="date"
                   class="w-full ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
          <div>
            <label for="finPagamentoForma" class="ctl-rotulo text-gray-300">Forma de pagamento <span class="fin-obrigatorio">*</span></label>
            <select id="finPagamentoForma" class="w-full appearance-none select-arrow ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition">
              <option value="">Selecione</option>
              <option value="Pix">Pix</option>
              <option value="Transferência">Transferência</option>
              <option value="Depósito">Depósito</option>
              <option value="Dinheiro">Dinheiro</option>
              <option value="Cheque">Cheque</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label for="finPagamentoObservacoes" class="ctl-rotulo text-gray-300">Observações</label>
            <textarea id="finPagamentoObservacoes" rows="3" maxlength="500" placeholder="Opcional"
                      class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition"></textarea>
          </div>
        </div>

        <div id="finPagamentoMensagem" class="hidden text-sm" role="alert"></div>
      </section>
    </div>

    <footer class="px-8 py-5 border-t border-white/10 ctl-acoes justify-end flex-shrink-0">
      <button type="button" data-fin-fechar class="btn-danger ctl-botao text-white min-w-[120px]">Cancelar</button>
      <button id="finPagamentoConfirmar" type="button" data-perm="financeiro.pagamento.confirmar" class="btn-success ctl-botao min-w-[160px]">Confirmar pagamento</button>
    </footer>
  </div>
</div>
