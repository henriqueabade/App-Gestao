<div id="pessoaContatoOverlay" class="fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4 ctl-padrao">
  <div class="max-w-md w-full glass-surface backdrop-blur-xl rounded-2xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade">
    <header class="grid grid-cols-3 items-center px-6 py-4 border-b border-white/10">
      <button id="voltarPessoaContato" class="btn-neutral ctl-botao text-white justify-self-start">← Voltar</button>
      <h2 id="pessoaContatoTitulo" class="ctl-modal-titulo text-white text-center">Nova pessoa</h2>
      <span></span>
    </header>
    <form id="pessoaContatoForm" class="p-6 space-y-4">
      <div class="relative">
        <input id="pessoaNome" name="nome" type="text" maxlength="150" placeholder=" " class="peer w-full ctl-campo bg-input border border-inputBorder text-white placeholder-transparent focus:border-primary focus:ring-2 focus:ring-primary/50 transition" required />
        <label for="pessoaNome" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-valid:top-0 peer-valid:-translate-y-full peer-valid:text-xs">Nome</label>
      </div>
      <div class="relative">
        <input id="pessoaCargo" name="cargo" type="text" maxlength="100" placeholder=" " class="peer w-full ctl-campo bg-input border border-inputBorder text-white placeholder-transparent focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
        <label for="pessoaCargo" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-valid:top-0 peer-valid:-translate-y-full peer-valid:text-xs">Cargo</label>
      </div>
      <div class="relative">
        <input id="pessoaEmail" name="email" type="email" maxlength="150" placeholder=" " class="peer w-full ctl-campo bg-input border border-inputBorder text-white placeholder-transparent focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
        <label for="pessoaEmail" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-valid:top-0 peer-valid:-translate-y-full peer-valid:text-xs">E-mail</label>
      </div>
      <div class="relative">
        <input id="pessoaCelular" name="telefone_celular" type="text" inputmode="numeric" maxlength="40" placeholder=" " class="peer w-full ctl-campo bg-input border border-inputBorder text-white placeholder-transparent focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
        <label for="pessoaCelular" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-valid:top-0 peer-valid:-translate-y-full peer-valid:text-xs">Celular</label>
      </div>
      <div class="relative">
        <input id="pessoaTelefone" name="telefone_fixo" type="text" inputmode="numeric" maxlength="40" placeholder=" " class="peer w-full ctl-campo bg-input border border-inputBorder text-white placeholder-transparent focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
        <label for="pessoaTelefone" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-placeholder-shown:top-1/2 peer-placeholder-shown:-translate-y-1/2 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-valid:top-0 peer-valid:-translate-y-full peer-valid:text-xs">Telefone</label>
      </div>
    </form>
    <footer class="flex justify-end px-6 py-4 border-t border-white/10">
      <button type="submit" form="pessoaContatoForm" class="btn-primary ctl-botao text-white">Registrar</button>
    </footer>
  </div>
</div>
