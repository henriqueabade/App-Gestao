<div id="novoContatoOverlay" class="hidden fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4 pt-[4vw] ctl-padrao">
  <div class="w-full max-w-6xl h-[90vh] glass-surface backdrop-blur-xl rounded-3xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade slide-in overflow-hidden flex flex-col">
    <header class="grid grid-cols-3 items-center px-8 py-5 border-b border-white/10 flex-shrink-0">
      <button id="voltarNovoContato" class="btn-neutral ctl-botao text-white justify-self-start">← Voltar</button>
      <h2 id="contatoNovoTitulo" class="ctl-modal-titulo text-white text-center">Novo Contato</h2>
      <span></span>
    </header>

    <nav class="px-8 border-b border-white/10 flex-shrink-0" role="tablist">
      <div class="flex gap-8 overflow-x-auto scrollbar-hide">
        <button id="tab-dados" role="tab" aria-selected="true" aria-controls="panel-dados" tabindex="0" class="py-4 px-2 text-sm font-medium border-b-2 tab-active whitespace-nowrap transition">Dados</button>
        <button id="tab-pessoas" role="tab" aria-selected="false" aria-controls="panel-pessoas" tabindex="-1" class="py-4 px-2 text-sm font-medium text-gray-400 border-b-2 border-transparent hover:text-white transition whitespace-nowrap">Pessoas de contato</button>
        <button id="tab-endereco" role="tab" aria-selected="false" aria-controls="panel-endereco" tabindex="-1" class="py-4 px-2 text-sm font-medium text-gray-400 border-b-2 border-transparent hover:text-white transition whitespace-nowrap">Endereço</button>
        <button id="tab-notas" role="tab" aria-selected="false" aria-controls="panel-notas" tabindex="-1" class="py-4 px-2 text-sm font-medium text-gray-400 border-b-2 border-transparent hover:text-white transition whitespace-nowrap">Notas</button>
      </div>
    </nav>

    <div class="flex-1 overflow-y-auto modal-scroll">
      <section id="panel-dados" role="tabpanel" aria-labelledby="tab-dados" class="px-8 py-6">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
          <div class="md:col-span-3 flex flex-col items-center">
            <div id="contatoAvatar" class="w-32 h-32 glass-surface rounded-full flex items-center justify-center text-4xl font-bold text-primary border-2 border-primary/20"></div>
          </div>
          <div class="md:col-span-9">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="ctl-rotulo text-gray-300">Nome (empresa ou pessoa)</label>
                <input id="contatoNome" data-perm-col="col_ctt_nome" type="text" maxlength="150" placeholder="Madeiras Silva" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
              </div>
              <div>
                <label class="ctl-rotulo text-gray-300">Razão Social</label>
                <input id="contatoRazaoSocial" type="text" maxlength="200" placeholder="Madeiras Silva Comércio Ltda" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
              </div>
              <!-- Tipo: a lista editável com + e − (utils/contato-tipos.js). Obrigatório. -->
              <div>
                <label class="ctl-rotulo text-gray-300">Tipo</label>
                <div class="relative">
                  <select id="contatoTipo" data-perm-col="col_ctt_tipo" title="Tipo do contato" class="w-full ctl-campo ctl-campo--dois-icones bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition">
                    <option value="">Tipo (selecionar)</option>
                  </select>
                  <button type="button" id="delTipoContato" data-perm="ctt.type.manage" class="absolute right-10 top-1/2 -translate-y-1/2 btn-neutral icon-only text-gray-300 hover:text-white" aria-label="Excluir um tipo da lista" title="Excluir um tipo da lista">
                    <i class="fas fa-minus"></i>
                  </button>
                  <button type="button" id="addTipoContato" data-perm="ctt.type.manage" class="absolute right-2 top-1/2 -translate-y-1/2 btn-neutral icon-only text-gray-300 hover:text-white" aria-label="Incluir um tipo na lista" title="Incluir um tipo na lista">
                    <i class="fas fa-plus"></i>
                  </button>
                </div>
              </div>
              <div>
                <label class="ctl-rotulo text-gray-300">Tipo de pessoa</label>
                <select id="contatoTipoPessoa" class="w-full ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition select-arrow appearance-none">
                  <option value="PJ">Pessoa jurídica (CNPJ)</option>
                  <option value="PF">Pessoa física (CPF)</option>
                </select>
              </div>
              <div id="contatoCnpjBloco">
                <label class="ctl-rotulo text-gray-300">CNPJ</label>
                <input id="contatoCnpj" data-perm-col="col_ctt_cnpj" type="text" inputmode="numeric" placeholder="00.000.000/0001-00" maxlength="18" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
              </div>
              <div id="contatoCpfBloco" class="hidden">
                <label class="ctl-rotulo text-gray-300">CPF</label>
                <input id="contatoCpf" type="text" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
              </div>
              <div>
                <label class="ctl-rotulo text-gray-300">Inscrição Estadual</label>
                <input id="contatoInscricaoEstadual" type="text" maxlength="20" placeholder="000.000.000.000" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
              </div>
              <div>
                <label class="ctl-rotulo text-gray-300">Inscrição Municipal</label>
                <input id="contatoInscricaoMunicipal" type="text" maxlength="20" placeholder="Só para prestador de serviço" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
              </div>
              <div>
                <label class="ctl-rotulo text-gray-300">E-mail</label>
                <input id="contatoEmail" type="email" maxlength="150" placeholder="contato@fornecedor.com.br" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
              </div>
              <div>
                <label class="ctl-rotulo text-gray-300">Site</label>
                <input id="contatoSite" type="url" maxlength="150" placeholder="https://www.exemplo.com.br" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
              </div>
              <div>
                <label class="ctl-rotulo text-gray-300">Celular</label>
                <input id="contatoCelular" data-perm-col="col_ctt_tel" type="text" inputmode="numeric" maxlength="40" placeholder="(31) 99999-0000" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
              </div>
              <div>
                <label class="ctl-rotulo text-gray-300">Telefone</label>
                <input id="contatoTelefone" data-perm-col="col_ctt_fixo" type="text" inputmode="numeric" maxlength="40" placeholder="(31) 3333-0000" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
              </div>
              <div>
                <label class="ctl-rotulo text-gray-300">Status</label>
                <select id="contatoStatus" class="w-full ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition select-arrow appearance-none">
                  <option value="Ativo">Ativo</option>
                  <option value="Inativo">Inativo</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="panel-pessoas" role="tabpanel" aria-labelledby="tab-pessoas" class="px-8 py-6 hidden">
        <div class="flex justify-between items-center mb-6">
          <div>
            <h3 class="ctl-secao text-white">Pessoas de contato</h3>
            <p class="text-xs text-gray-400 mt-1">Com quem se fala nesta empresa: vendedor, financeiro, sócio…</p>
          </div>
          <button id="addPessoaBtn" data-perm="ctt.person.add" class="btn-primary ctl-botao text-white">+ Nova pessoa</button>
        </div>
        <div class="glass-surface rounded-xl border border-white/10 table-scroll">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b">
                  <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">NOME</th>
                  <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">CARGO</th>
                  <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">E-MAIL</th>
                  <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">CELULAR</th>
                  <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">TELEFONE</th>
                  <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">AÇÕES</th>
                </tr>
              </thead>
              <tbody id="pessoasTabela">
                <tr>
                  <td colspan="6" class="py-12 text-left text-gray-400">Nenhuma pessoa cadastrada</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="panel-endereco" role="tabpanel" aria-labelledby="tab-endereco" class="px-8 py-6 hidden">
        <h3 class="ctl-secao text-white mb-4">Endereço</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2">
            <label class="ctl-rotulo text-gray-300">Rua</label>
            <input id="endRua" type="text" placeholder="Nome da rua" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
          <div>
            <label class="ctl-rotulo text-gray-300">Número</label>
            <input id="endNumero" type="text" placeholder="123" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
          <div>
            <label class="ctl-rotulo text-gray-300">Complemento</label>
            <input id="endComplemento" type="text" placeholder="Galpão 2" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
          <div>
            <label class="ctl-rotulo text-gray-300">Bairro</label>
            <input id="endBairro" type="text" placeholder="Centro" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
          <div>
            <label class="ctl-rotulo text-gray-300">Cidade</label>
            <input id="endCidade" type="text" placeholder="Contagem" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
          <div>
            <label class="ctl-rotulo text-gray-300">País</label>
            <select id="endPais" class="w-full ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition select-arrow appearance-none">
              <option value="">Selecione</option>
            </select>
          </div>
          <div>
            <label class="ctl-rotulo text-gray-300">Estado</label>
            <select id="endEstado" class="w-full ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition select-arrow appearance-none" disabled>
              <option value="">Selecione o país</option>
            </select>
          </div>
          <div>
            <label class="ctl-rotulo text-gray-300">CEP</label>
            <div class="flex gap-2">
              <input id="endCep" type="text" placeholder="00000-000" class="flex-1 min-w-0 ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
              <button id="endBuscarCep" type="button" class="btn-neutral ctl-botao ctl-botao--icone text-white" title="Buscar o endereço pelo CEP" aria-label="Buscar o endereço pelo CEP"><i class="fas fa-search" aria-hidden="true"></i></button>
            </div>
            <p id="endCepRecado" class="hidden mt-2 text-xs" role="status"></p>
          </div>
          <div>
            <label class="ctl-rotulo text-gray-300">Código IBGE</label>
            <input id="endCodigoMunicipio" type="text" inputmode="numeric" maxlength="7" placeholder="7 dígitos" class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
          </div>
        </div>
      </section>

      <section id="panel-notas" role="tabpanel" aria-labelledby="tab-notas" class="px-8 py-6 hidden">
        <div>
          <label class="ctl-rotulo text-gray-300">Observações</label>
          <textarea id="contatoNotas" rows="12" placeholder="Digite suas observações sobre o contato..." class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition resize-none"></textarea>
        </div>
      </section>
    </div>

    <footer class="ctl-acoes justify-end px-8 py-5 border-t border-white/10 flex-shrink-0">
      <button id="cancelarNovoContato" class="btn-danger ctl-botao text-white min-w-[120px]">Cancelar</button>
      <button id="registrarContato" class="btn-success ctl-botao text-white min-w-[120px]">Registrar</button>
    </footer>
  </div>
</div>
