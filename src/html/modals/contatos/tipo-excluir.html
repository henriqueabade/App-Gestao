<div id="excluirTipoContatoOverlay" class="fixed inset-0 z-[1300] bg-black/50 flex items-center justify-center p-4 ctl-padrao">
  <div class="max-w-sm w-full glass-surface backdrop-blur-xl rounded-2xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade">
    <header class="relative px-6 py-4 border-b border-white/10">
      <h2 class="ctl-modal-titulo text-center text-white">EXCLUIR TIPO</h2>
      <button id="fecharExcluirTipoContato" class="btn-danger ctl-botao ctl-botao--pequeno ctl-botao--icone absolute right-4 top-4 text-white">✕</button>
    </header>
    <form id="excluirTipoContatoForm" class="p-6">
      <div class="relative">
        <select id="tipoContatoExcluir" name="id" required class="peer w-full appearance-none ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" data-filled="false">
          <option value="" disabled selected hidden></option>
        </select>
        <label for="tipoContatoExcluir" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-data-[filled=true]:top-0 peer-data-[filled=true]:-translate-y-full peer-data-[filled=true]:text-xs">Tipo</label>
      </div>
      <p id="confirmExcluirTipoContato" class="mt-4 text-sm text-red-400 hidden" role="alert">Esta ação é irreversível. Clique em excluir novamente para confirmar.</p>
    </form>
    <footer class="ctl-acoes justify-end px-6 py-4 border-t border-white/10">
      <button type="button" id="cancelarExcluirTipoContato" class="btn-danger ctl-botao text-white active:scale-95">Cancelar</button>
      <button type="button" id="excluirTipoContato" data-perm="ctt.type.manage" class="btn-danger ctl-botao text-white active:scale-95">Excluir</button>
    </footer>
  </div>
</div>
