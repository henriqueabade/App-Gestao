<div id="pagamentoPedidoOverlay" class="hidden fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4 pt-[4vw] ctl-padrao">
  <div role="dialog" aria-modal="true" class="w-full max-w-3xl max-h-[90vh] glass-surface backdrop-blur-xl rounded-3xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade slide-in overflow-hidden flex flex-col">

    <header class="grid grid-cols-3 items-center px-8 py-5 border-b border-white/10 flex-shrink-0">
      <button id="voltarPagamentoPedido" class="btn-neutral ctl-botao text-white justify-self-start">← Voltar</button>
      <h2 class="ctl-modal-titulo text-white text-center truncate">Pagamento do pedido</h2>
      <span id="pagamentoPedidoNumero" class="text-sm text-gray-300 justify-self-end truncate"></span>
    </header>

    <div class="flex-1 overflow-y-auto modal-scroll">
      <section class="px-8 py-6 space-y-6">

        <!-- Contexto: o que NÃO se altera aqui. Deixar visível evita o usuário
             procurar por peças e quantidades num modal que não as edita. -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="glass-surface rounded-xl px-4 py-3 border border-white/10">
            <p class="text-xs text-gray-400 mb-1">Cliente</p>
            <p id="pagamentoPedidoCliente" class="text-sm text-white truncate">—</p>
          </div>
          <div class="glass-surface rounded-xl px-4 py-3 border border-white/10">
            <p class="text-xs text-gray-400 mb-1">Emissão</p>
            <p id="pagamentoPedidoEmissao" class="text-sm text-white">—</p>
          </div>
          <div class="glass-surface rounded-xl px-4 py-3 border border-white/10">
            <p class="text-xs text-gray-400 mb-1">Peças</p>
            <p id="pagamentoPedidoItens" class="text-sm text-white">—</p>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="relative">
            <select id="pagamentoPedidoCondicao" class="peer w-full appearance-none ctl-campo ctl-campo--icone bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" data-filled="true">
              <option value="vista">À vista</option>
              <option value="prazo">À prazo</option>
            </select>
            <label for="pagamentoPedidoCondicao" class="absolute left-3 top-0 -translate-y-full text-xs text-gray-300 pointer-events-none">Condição de pagamento</label>
            <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none"></i>
          </div>

          <div class="relative">
            <select id="pagamentoPedidoForma" class="peer w-full appearance-none ctl-campo ctl-campo--icone bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" data-filled="false">
              <option value="" disabled selected hidden></option>
              <option value="boleto">Boleto</option>
              <option value="pix">Pix</option>
              <option value="cartao">Cartão de Crédito</option>
            </select>
            <label for="pagamentoPedidoForma" class="absolute left-3 top-0 -translate-y-full text-xs text-gray-300 pointer-events-none">Forma de pagamento</label>
            <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none"></i>
          </div>
        </div>

        <!-- Prazo (à vista) ou parcelamento (a prazo) — trocado pelo script. -->
        <div id="pagamentoPedidoBox"></div>

        <!-- Parcelas que somam MAIS (Adicional) ou MENOS (Desconto) que os itens:
             o total do pedido passa a ser a soma, com a justificativa (decisões
             do dono, 24/09/2026 — backend/pedidoParcelas.js). -->
        <div id="pagamentoPedidoAjuste" class="hidden glass-surface rounded-xl border border-white/10 p-4 space-y-2">
          <p id="pagamentoPedidoAjusteTexto" class="text-sm text-white"></p>
          <label for="pagamentoPedidoJustificativa" class="ctl-rotulo text-gray-300">Justificativa da diferença <span style="color: var(--color-red)">*</span></label>
          <textarea id="pagamentoPedidoJustificativa" rows="2" maxlength="1000" data-no-restore="true"
                    class="w-full ctl-campo bg-input border border-inputBorder text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition"
                    placeholder="Ex.: frete combinado com o cliente; acerto por avaria"></textarea>
          <p class="text-xs text-gray-400">Fica guardada no pedido, com quem mudou e quando. Na tabela de itens aparece uma linha a mais, "Adicional" ou "Desconto", com a diferença.</p>
        </div>

        <!-- Vencimentos resultantes: o início do faturamento mais o prazo de
             cada parcela, em dias. O início é o do pedido
             (inicio_faturamento), definido na conversão ou em "Embarque e
             faturamento"; no pedido antigo, sem início gravado, conta do dia
             da emissão em São Paulo. É a mesma conta que o backend faz ao
             gravar. Mostrá-los evita o usuário ter de fazer a conta de cabeça
             para saber o que está combinando, e o resumo acima deles diz de
             onde a conta parte. -->
        <div class="space-y-2">
          <p class="text-xs text-gray-300 flex items-center gap-2">
            <i class="fas fa-truck text-gray-400" aria-hidden="true"></i>
            <span id="pagamentoPedidoDatasResumo"></span>
          </p>
          <div id="pagamentoPedidoVencimentos" class="hidden">
            <p class="text-xs text-gray-400 mb-2">Vencimentos</p>
            <div id="pagamentoPedidoVencimentosLista" class="flex flex-wrap gap-2"></div>
          </div>
        </div>

        <div class="glass-surface rounded-xl border border-white/10 divide-y divide-white/10">
          <div class="flex items-center justify-between px-4 py-3">
            <span class="text-sm text-gray-400">Subtotal</span>
            <span id="pagamentoPedidoSubtotal" class="text-sm text-white">—</span>
          </div>
          <div class="flex items-center justify-between px-4 py-3">
            <span class="text-sm text-gray-400">Desconto de pagamento</span>
            <span id="pagamentoPedidoDescPag" class="text-sm text-white">—</span>
          </div>
          <div class="flex items-center justify-between px-4 py-3">
            <span class="text-sm text-gray-400">Desconto especial</span>
            <span id="pagamentoPedidoDescEsp" class="text-sm text-white">—</span>
          </div>
          <div class="flex items-center justify-between px-4 py-4">
            <span class="text-sm font-medium text-white">Total do pedido</span>
            <span id="pagamentoPedidoTotal" class="text-xl font-bold" style="color: var(--color-green)">—</span>
          </div>
        </div>

        <div id="pagamentoPedidoMensagem" class="hidden text-sm"></div>
      </section>
    </div>

    <footer class="px-8 py-5 border-t border-white/10 ctl-acoes justify-end flex-shrink-0">
      <button id="cancelarPagamentoPedido" class="btn-danger ctl-botao text-white min-w-[120px]">Cancelar</button>
      <button id="salvarPagamentoPedido" data-perm="ped.payment.edit" class="btn-success ctl-botao text-white min-w-[120px]">Salvar</button>
    </footer>
  </div>
</div>
