<!--
  Datas do pedido: previsão de embarque e início do faturamento.

  Abre por cima da conversão (em Orçamentos, Pedidos e Prospecções) e do
  pagamento do pedido, por isso o z alto, como o "Substituir Peça". Não fecha
  clicando fora (docs/padroes-de-interface.md): sai por Voltar, Cancelar ou Esc.

  Os campos de data são TEXTO com máscara dd/mm/aaaa. O campo de data nativo
  segue o idioma do sistema (num Windows em inglês ele vira mm/dd/yyyy) e se
  digita por segmentos. O calendário continua a um clique, no botão ao lado,
  que abre o seletor de um campo de data nativo INVISÍVEL: invisível por
  opacidade, e não por display:none, senão o showPicker() não tem onde se
  ancorar e não abre.

  Os estilos que precisam valer em qualquer página ficam inline: o CSS é
  carregado por página, e este modal abre a partir de três.
-->
<div id="datasPedidoOverlay" class="hidden fixed inset-0 z-[12000] bg-black/50 flex items-center justify-center p-4" aria-hidden="true" data-modal-loading="true">
  <div role="dialog" aria-modal="true" aria-labelledby="datasPedidoTitulo" class="w-full max-w-lg max-h-[90vh] glass-surface backdrop-blur-xl rounded-2xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade overflow-hidden flex flex-col">

    <header class="grid grid-cols-3 items-center px-6 py-4 border-b border-white/10 flex-shrink-0">
      <button id="voltarDatasPedido" type="button" class="btn-neutral px-4 py-2 rounded-lg text-white font-medium justify-self-start">← Voltar</button>
      <div class="text-center min-w-0">
        <h2 id="datasPedidoTitulo" class="text-lg font-semibold text-white truncate">Datas do pedido</h2>
        <p id="datasPedidoSubtitulo" class="hidden text-xs text-gray-300 truncate"></p>
      </div>
      <span></span>
    </header>

    <div class="flex-1 overflow-y-auto modal-scroll">
      <div class="p-6 space-y-6">

        <!-- Previsão de embarque: obrigatória. -->
        <div>
          <label for="datasPedidoEmbarque" class="block text-sm font-medium text-gray-300 mb-2">Previsão de embarque <span style="color: var(--color-red)">*</span></label>
          <div class="flex items-center gap-2">
            <input id="datasPedidoEmbarque" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" autocomplete="off" aria-describedby="datasPedidoEmbarqueErro"
                   class="flex-1 min-w-0 bg-input border border-inputBorder rounded-lg px-4 py-3 text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
            <span class="relative inline-flex flex-shrink-0">
              <button id="datasPedidoEmbarqueCalendario" type="button" class="btn-neutral border border-white/10 rounded-lg text-white px-4 py-3" title="Escolher no calendário" aria-label="Escolher a previsão de embarque no calendário"><i class="fas fa-calendar-alt" aria-hidden="true"></i></button>
              <input id="datasPedidoEmbarqueNativo" type="date" tabindex="-1" aria-hidden="true" data-no-restore="true"
                     style="position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; border: 0; padding: 0;" />
            </span>
          </div>
          <p id="datasPedidoEmbarqueErro" class="hidden mt-2 text-xs" style="color: var(--color-red)" role="alert"></p>
          <p id="datasPedidoAviso" class="hidden mt-2 text-xs" style="color: var(--color-primary)"></p>
        </div>

        <!-- Início do faturamento. A regra fica gravada no pedido
             (faturamento_regra) e decide o que acontece quando ele embarcar. -->
        <div role="radiogroup" aria-labelledby="datasPedidoRegraTitulo" class="space-y-3">
          <p id="datasPedidoRegraTitulo" class="block text-sm font-medium text-gray-300 mb-2">Início do faturamento</p>

          <label class="flex items-start gap-3 cursor-pointer">
            <input id="datasPedidoRegraEmbarque" type="radio" name="datasPedidoRegra" value="ao_embarcar" class="mt-1 flex-shrink-0" style="accent-color: var(--color-primary)" />
            <span class="min-w-0">
              <span class="block text-white">Ao embarcar</span>
              <span id="datasPedidoRegraEmbarqueInfo" class="block text-xs text-gray-400">Usa a previsão de embarque.</span>
            </span>
          </label>

          <label class="flex items-start gap-3 cursor-pointer">
            <input id="datasPedidoRegraConversao" type="radio" name="datasPedidoRegra" value="ao_converter" class="mt-1 flex-shrink-0" style="accent-color: var(--color-primary)" />
            <span class="min-w-0">
              <span id="datasPedidoRegraConversaoRotulo" class="block text-white">Ao converter</span>
              <span id="datasPedidoRegraConversaoInfo" class="block text-xs text-gray-400"></span>
            </span>
          </label>

          <label class="flex items-start gap-3 cursor-pointer">
            <input id="datasPedidoRegraData" type="radio" name="datasPedidoRegra" value="data" class="mt-1 flex-shrink-0" style="accent-color: var(--color-primary)" />
            <span class="min-w-0">
              <span class="block text-white">Data específica</span>
              <span class="block text-xs text-gray-400">Escolha o dia no campo abaixo.</span>
            </span>
          </label>

          <!-- Só vale na "Data específica"; nas outras regras fica travado. -->
          <div id="datasPedidoInicioBloco" style="padding-left: 1.75rem">
            <label for="datasPedidoInicio" class="sr-only">Data de início do faturamento</label>
            <div class="flex items-center gap-2">
              <input id="datasPedidoInicio" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" autocomplete="off" aria-describedby="datasPedidoInicioErro" disabled
                     class="flex-1 min-w-0 bg-input border border-inputBorder rounded-lg px-4 py-3 text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
              <span class="relative inline-flex flex-shrink-0">
                <button id="datasPedidoInicioCalendario" type="button" class="btn-neutral border border-white/10 rounded-lg text-white px-4 py-3" title="Escolher no calendário" aria-label="Escolher o início do faturamento no calendário" disabled><i class="fas fa-calendar-alt" aria-hidden="true"></i></button>
                <input id="datasPedidoInicioNativo" type="date" tabindex="-1" aria-hidden="true" data-no-restore="true"
                       style="position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; border: 0; padding: 0;" />
              </span>
            </div>
            <p id="datasPedidoInicioErro" class="hidden mt-2 text-xs" style="color: var(--color-red)" role="alert"></p>
          </div>
        </div>

        <!-- Prévia: início do faturamento + o prazo de cada parcela, a mesma
             conta que o backend faz ao gravar. -->
        <div id="datasPedidoPrevia" class="glass-surface rounded-xl px-4 py-3 border border-white/10">
          <p class="text-xs text-gray-400 mb-2">Vencimentos</p>
          <p id="datasPedidoPreviaTexto" class="text-sm text-white"></p>
          <div id="datasPedidoVencimentosLista" class="hidden flex flex-wrap gap-2 mt-2"></div>
        </div>

        <div id="datasPedidoMensagem" class="hidden text-sm" role="alert"></div>
      </div>
    </div>

    <footer class="flex justify-end gap-4 px-6 py-4 border-t border-white/10 flex-shrink-0">
      <button id="cancelarDatasPedido" type="button" class="btn-danger px-6 py-2 rounded-lg text-white font-medium min-w-[120px]">Cancelar</button>
      <!-- Um botão por modo; o script mostra um e tira o outro.
           Na conversão não há guarda própria: quem chega aqui já passou pela
           de converter (orc.convert). No pedido, gravar as datas é a
           permissão ped.dates.edit, e ela fica ESCRITA no HTML, e não posta
           por script: o permissoes.js só aplica a guarda em nó INSERIDO (o
           observador olha childList); um atributo acrescentado depois ficaria
           sem efeito. -->
      <button id="confirmarDatasPedido" type="button" class="hidden btn-success px-6 py-2 rounded-lg font-medium min-w-[120px]">Confirmar</button>
      <button id="salvarDatasPedido" type="button" data-perm="ped.dates.edit" class="hidden btn-success px-6 py-2 rounded-lg font-medium min-w-[120px]">Salvar</button>
    </footer>
  </div>
</div>
