<div id="converterOrcamentosOverlay" class="hidden fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4">
  <div role="dialog" aria-modal="true" tabindex="0" class="w-full max-w-5xl max-h-[90vh] bg-surface/60 backdrop-blur-xl rounded-3xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade slide-in overflow-hidden flex flex-col">
    <header class="flex flex-wrap items-center justify-between gap-4 px-8 py-5 border-b border-white/10 flex-shrink-0">
      <button id="voltarConverterOrcamentos" class="btn-neutral px-4 py-2 rounded-lg text-white font-medium flex items-center gap-2">← Voltar</button>
      <div class="flex-1 text-center">
        <h2 class="text-lg font-semibold text-white">Converter Orçamento</h2>
        <p class="text-sm text-gray-300">Selecione os orçamentos que devem virar pedido</p>
      </div>
      <div class="flex items-center gap-3">
        <button id="cancelarConverterOrcamentos" class="btn-neutral px-4 py-2 rounded-lg text-white font-medium">Cancelar</button>
        <button id="confirmarConverterOrcamentos" data-perm="orc.convert" class="btn-primary px-6 py-2 rounded-lg text-white font-medium">Converter</button>
      </div>
    </header>

    <div class="px-8 py-4 border-b border-white/10 flex-shrink-0 flex flex-wrap items-center justify-between gap-4">
      <div class="relative w-full sm:w-80">
        <input id="buscaConverterOrcamentos" type="text" placeholder="Buscar por código ou cliente" class="w-full bg-input border border-inputBorder rounded-lg px-4 py-2.5 text-white placeholder-gray-400 focus:border-primary focus:ring-2 focus:ring-primary/50 transition" />
      </div>
      <span id="resumoConverterOrcamentos" class="badge-info px-3 py-1 rounded-full text-xs font-medium">Nenhum orçamento selecionado</span>
    </div>

    <div class="flex-1 overflow-y-auto modal-scroll">
      <div class="px-8 py-6">
        <div id="converterOrcamentosTabelaWrapper" class="bg-surface/40 rounded-2xl border border-white/10 overflow-hidden">
          <div class="table-scroll">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b border-white/10">
                  <th class="w-12 text-left py-3 px-4">
                    <input id="selecionarTodosConverterOrcamentos" type="checkbox" class="component-toggle" title="Selecionar todos" />
                  </th>
                  <th class="text-left py-3 px-4 text-gray-300 font-medium whitespace-nowrap">Código</th>
                  <th class="text-left py-3 px-4 text-gray-300 font-medium whitespace-nowrap">Cliente</th>
                  <th class="text-left py-3 px-4 text-gray-300 font-medium whitespace-nowrap">Data</th>
                  <th class="text-left py-3 px-4 text-gray-300 font-medium whitespace-nowrap">Valor</th>
                </tr>
              </thead>
              <tbody id="converterOrcamentosTabela"></tbody>
            </table>
          </div>
        </div>

        <div id="converterOrcamentosVazio" class="hidden py-16 text-center">
          <i class="fas fa-file-invoice-dollar text-4xl text-gray-500 mb-4"></i>
          <p class="text-gray-300 font-medium">Nenhum orçamento disponível para conversão</p>
          <p class="text-gray-400 text-sm mt-1">
            Orçamentos em rascunho, cancelados, expirados ou rejeitados não podem ser convertidos.
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
