<div id="visualizarPedidoOverlay" class="hidden fixed inset-0 z-[1002] bg-black/50 flex items-center justify-center p-4 pt-[4vw] ctl-padrao">
  <div role="dialog" aria-modal="true" tabindex="0" class="w-full max-w-7xl h-[90vh] glass-surface backdrop-blur-xl rounded-3xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade slide-in overflow-hidden flex flex-col">
    <header class="relative flex items-center justify-between px-8 py-5 border-b border-white/10 flex-shrink-0">
      <div class="flex items-center gap-3">
        <button id="voltarVisualizarPedido" class="btn-neutral ctl-botao text-white">← Voltar</button>
        <div class="relative">
          <select id="visualizarPedidoDono" data-perm-col="col_ped_campo_dono" class="peer w-48 appearance-none ctl-campo ctl-campo--icone bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" data-filled="false" disabled></select>
          <label for="visualizarPedidoDono" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-data-[filled=true]:top-0 peer-data-[filled=true]:-translate-y-full peer-data-[filled=true]:text-xs">Dono</label>
          <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none"></i>
        </div>
      </div>
      <h2 id="tituloVisualizarPedido" class="absolute left-1/2 -translate-x-1/2 ctl-modal-titulo text-white">VISUALIZAR PEDIDO</h2>
      <div class="flex items-center gap-3">
        <span id="dataStatusPedidoTag" class="text-sm text-gray-300 hidden"></span>
        <span id="statusPedidoTag" class="badge-warning px-3 py-1 rounded-full text-xs font-medium">Pendente</span>
      </div>
    </header>
    <div class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden modal-scroll">
      <div class="px-8 py-6 h-full min-h-0 flex flex-col gap-6">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="relative">
            <select id="visualizarPedidoCliente" class="peer w-full appearance-none ctl-campo ctl-campo--icone bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" data-filled="false" disabled></select>
            <label for="visualizarPedidoCliente" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-data-[filled=true]:top-0 peer-data-[filled=true]:-translate-y-full peer-data-[filled=true]:text-xs">Cliente</label>
            <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none"></i>
          </div>
          <div class="relative">
            <select id="visualizarPedidoContato" class="peer w-full appearance-none ctl-campo ctl-campo--icone bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" data-filled="false" disabled></select>
            <label for="visualizarPedidoContato" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-data-[filled=true]:top-0 peer-data-[filled=true]:-translate-y-full peer-data-[filled=true]:text-xs">Contato</label>
            <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none"></i>
          </div>
          <div class="relative">
            <input id="visualizarPedidoValidade" type="date" placeholder=" " class="peer w-full ctl-campo bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" disabled />
            <label for="visualizarPedidoValidade" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-valid:top-0 peer-valid:-translate-y-full peer-valid:text-xs peer-data-[filled=true]:top-0 peer-data-[filled=true]:-translate-y-full peer-data-[filled=true]:text-xs">Validade</label>
            <i class="fas fa-calendar-alt absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none"></i>
          </div>
          <div class="relative">
            <select id="visualizarPedidoCondicao" class="peer w-full appearance-none ctl-campo ctl-campo--icone bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" data-filled="false" disabled>
              <option value="vista">À vista</option>
              <option value="prazo">À prazo</option>
            </select>
            <label for="visualizarPedidoCondicao" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-data-[filled=true]:top-0 peer-data-[filled=true]:-translate-y-full peer-data-[filled=true]:text-xs">Condição de pagamento</label>
            <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none"></i>
          </div>
          <div class="relative">
            <select id="visualizarPedidoTransportadora" data-perm-col="col_ped_campo_transportadora" class="peer w-full appearance-none ctl-campo ctl-campo--icone bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" data-filled="false" disabled></select>
            <label for="visualizarPedidoTransportadora" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-data-[filled=true]:top-0 peer-data-[filled=true]:-translate-y-full peer-data-[filled=true]:text-xs">Transportadora</label>
            <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none"></i>
          </div>
          <div class="relative">
            <select id="visualizarPedidoFormaPagamento" data-perm-col="col_ped_campo_pagamento" class="peer w-full appearance-none ctl-campo ctl-campo--icone bg-input border border-inputBorder text-white focus:border-primary focus:ring-2 focus:ring-primary/50 transition" data-filled="false" disabled>
              <option value="" disabled hidden></option>
              <option value="boleto">Boleto</option>
              <option value="pix">Pix</option>
              <option value="cartao">Cartão de Crédito</option>
            </select>
            <label for="visualizarPedidoFormaPagamento" class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-focus:top-0 peer-focus:-translate-y-full peer-focus:text-xs peer-focus:text-primary peer-data-[filled=true]:top-0 peer-data-[filled=true]:-translate-y-full peer-data-[filled=true]:text-xs">Forma de Pagamento</label>
            <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 pointer-events-none"></i>
          </div>
          <div class="relative lg:col-span-2">
            <textarea id="visualizarPedidoObservacoes" data-perm-col="col_ped_campo_observacoes" rows="2" placeholder=" " class="peer w-full ctl-campo bg-input border border-inputBorder text-white placeholder-transparent focus:border-primary focus:ring-2 focus:ring-primary/50 transition" disabled></textarea>
            <label for="visualizarPedidoObservacoes" class="absolute left-3 top-3 text-sm text-gray-300 pointer-events-none transition-all duration-150 peer-placeholder-shown:top-3 peer-focus:-top-2 peer-focus:text-xs peer-focus:text-primary peer-valid:-top-2 peer-valid:text-xs peer-data-[filled=true]:-top-2 peer-data-[filled=true]:text-xs">Observações</label>
          </div>
        </div>

        <div id="visualizarPedidoPagamento" class="glass-surface rounded-xl p-6 hidden"></div>

        <div class="flex-1 min-h-0 flex flex-col">
          <div class="flex items-center justify-between mb-6">
            <h3 class="ctl-secao text-white">Itens</h3>
            <div class="flex flex-wrap gap-2 text-sm ml-4">
              <span class="badge-neutral px-3 py-1 rounded-full font-medium">Subtotal: <span id="subtotalPedido">R$ 0,00</span></span>
              <span class="badge-warning px-3 py-1 rounded-full font-medium">Desc. Pagamento: <span id="descontoPagPedido">R$ 0,00</span></span>
              <span class="badge-orange px-3 py-1 rounded-full font-medium">Desc. Especial: <span id="descontoEspPedido">R$ 0,00</span></span>
              <span class="badge-danger px-3 py-1 rounded-full font-medium">Desconto: <span id="descontoPedido">R$ 0,00</span></span>
              <!-- Devolução: só aparece quando o pedido teve peça devolvida (o Total já vem sem ela). -->
              <span id="devolvidoPedidoChip" class="hidden badge-purple px-3 py-1 rounded-full font-medium">Devolvido: <span id="devolvidoPedido">R$ 0,00</span></span>
              <span class="badge-success px-3 py-1 rounded-full font-medium">Total: <span id="totalPedido">R$ 0,00</span></span>
            </div>
          </div>

          <div class="glass-surface rounded-xl shadow-lg animate-fade-in-up table-scroll items-table-scroll modal-scroll">
            <!-- Sem a coluna de ações: no Visualizar os itens não se editam, e o
                 espaço dela vai para o nome (#pedidoItens, pedidos.css). -->
            <table id="pedidoItens" class="w-full items-table">
              <thead class="sticky top-0">
                <tr class="border-b">
                  <th data-perm-col="col_ped_it_nome" class="text-left uppercase">ITEM</th>
                  <th data-perm-col="col_ped_it_qtd" class="text-left uppercase">QTD</th>
                  <th data-perm-col="col_ped_it_preco" class="text-left uppercase">UN R$</th>
                  <th data-perm-col="col_ped_it_preco_desc" class="text-left uppercase">UN C/DSC</th>
                  <th data-perm-col="col_ped_it_desc" class="text-left uppercase">DSC%</th>
                  <th data-perm-col="col_ped_it_subtotal" class="text-left uppercase">TOT R$</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
    <footer class="flex items-center justify-between gap-3 px-8 py-6 border-t border-white/10 flex-shrink-0">
      <span class="badge-success px-6 py-3 rounded-full text-lg font-semibold">Valor Total: <span id="totalPedidoFooter">R$ 0,00</span></span>
      <!-- Tags do embarque e da NF-e (só aparecem quando há o que mostrar) e,
           com nota autorizada, DANFE / XML / cancelar. As guardas ficam
           escritas no HTML; o script só tira o `hidden`. -->
      <div id="visualizarPedidoTags" class="flex flex-wrap items-center justify-center gap-2 flex-1 min-w-0">
        <span id="visualizarPedidoTagsLista" class="contents"></span>
        <button id="visualizarPedidoDanfe" type="button" data-perm="financeiro.nfe.view" class="hidden btn-neutral ctl-botao ctl-botao--pequeno text-white" title="Gerar o DANFE em PDF">DANFE</button>
        <button id="visualizarPedidoXml" type="button" data-perm="financeiro.nfe.view" class="hidden btn-neutral ctl-botao ctl-botao--pequeno text-white" title="Salvar o XML da NF-e">XML</button>
        <button id="visualizarPedidoEmailNfe" type="button" data-perm="financeiro.nfe.emit" class="hidden btn-neutral ctl-botao ctl-botao--pequeno text-white" title="Enviar DANFE e XML por e-mail">E-mail</button>
        <button id="visualizarPedidoCartaNfe" type="button" data-perm="financeiro.nfe.emit" class="hidden btn-neutral ctl-botao ctl-botao--pequeno text-white" title="Carta de correção eletrônica">Carta de correção</button>
        <button id="visualizarPedidoCancelarNfe" type="button" data-perm="financeiro.nfe.cancel" class="hidden btn-danger ctl-botao ctl-botao--pequeno text-white" title="Cancelar a NF-e na SEFAZ">Cancelar NF-e</button>
        <button id="visualizarPedidoGerarBoletos" type="button" data-perm="financeiro.boleto.emit" class="hidden btn-neutral ctl-botao ctl-botao--pequeno text-white" title="Registrar os boletos das parcelas no Banco do Brasil">Gerar boletos</button>
        <button id="visualizarPedidoBoletos" type="button" data-perm="financeiro.boleto.view" class="hidden btn-neutral ctl-botao ctl-botao--pequeno text-white" title="Boletos do pedido: situação no BB, prorrogar, abatimento e baixa">Boletos</button>
        <button id="visualizarPedidoBoletosPdf" type="button" data-perm="financeiro.boleto.view" class="hidden btn-neutral ctl-botao ctl-botao--pequeno text-white" title="Gerar o PDF de todos os boletos a pagar do pedido">Boletos (PDF)</button>
        <button id="visualizarPedidoImportarBoletos" type="button" data-perm="financeiro.boleto.view" class="hidden btn-bb ctl-botao ctl-botao--pequeno text-white" title="Trazer para o app um boleto deste pedido que já existe no Banco do Brasil (emitido antes, pelo Gerenciador Financeiro)">Importar do BB</button>
        <!-- Pedido que saiu sem nota (ou sem boleto) feita aqui: informa os dados
             da nota/boleto emitidos fora (pedido-dados-externos.js). Quem decide
             se aparece é precisaDeDadosDeFora; a permissão é a de emitir NF-e
             ou a de gerar boletos. -->
        <button id="visualizarPedidoDadosExternos" type="button" class="hidden btn-neutral ctl-botao ctl-botao--pequeno text-white" title="Informar a NF-e e os boletos emitidos fora do sistema">NF-e e boletos de fora</button>
      </div>
      <div class="ctl-acoes">
        <!-- Os três nascem escondidos; o script mostra os que a situação pede
             (botoesDoPedido): em produção, Cancelar e Enviar; enviado ou
             entregue, só Devolução; devolvido por inteiro ou cancelado, nenhum. -->
        <button id="cancelarVisualizarPedido" data-sem-guarda data-perm="ped.cancel" class="hidden btn-danger ctl-botao text-white">Cancelar</button>
        <button id="enviarVisualizarPedido" data-sem-guarda data-perm="ped.status.ship" class="hidden btn-success ctl-botao" title="Conferir a NF-e e marcar o pedido como enviado">Enviar</button>
        <button id="devolucaoVisualizarPedido" data-sem-guarda data-perm="ped.devolucao" class="hidden btn-devolucao ctl-botao text-white" title="Registrar a devolução de peças deste pedido">Devolução</button>
        <button id="voltarVisualizarPedidoFooter" class="btn-neutral ctl-botao text-white">Voltar</button>
      </div>
    </footer>
  </div>
</div>
