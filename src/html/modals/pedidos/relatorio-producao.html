<div id="relatorioProducaoOverlay" class="hidden fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4">
  <!-- `h-[90vh]` e não `max-h`: o relatório tem tamanho imprevisível (uma folha
       por processo) e o modal precisa de altura FIXA para o cabeçalho ficar
       parado e o miolo rolar. Com `max-h` o modal crescia junto do conteúdo. -->
  <div role="dialog" aria-modal="true" tabindex="0" class="w-full max-w-6xl h-[90vh] bg-surface/60 backdrop-blur-xl rounded-3xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade slide-in overflow-hidden flex flex-col">
    <header class="flex flex-wrap items-center justify-between gap-4 px-8 py-5 border-b border-white/10 flex-shrink-0">
      <button id="voltarRelatorioProducao" class="btn-neutral px-4 py-2 rounded-lg text-white font-medium flex items-center gap-2">← Voltar</button>
      <div class="flex-1 text-center">
        <h2 class="text-lg font-semibold text-white">Relatório de Produção</h2>
        <p id="relatorioProducaoSubtitulo" class="text-sm text-gray-300"></p>
      </div>
      <div class="flex items-center gap-3">
        <!-- Alterna entre a folha de produção (por processo) e a lista de peças
             (por peça). São recortes diferentes do mesmo pedido: a folha diz o
             que cada processo consome; esta diz de onde cada peça veio e quanto
             falta para ela ficar pronta. -->
        <button id="verPecasRelatorio" data-perm="ped.report" class="btn-secondary px-4 py-2 rounded-lg text-white font-medium flex items-center gap-2">
          <i class="fas fa-cubes"></i> <span id="verPecasRelatorioTexto">Peças</span>
        </button>
        <button id="fecharRelatorioProducao" class="btn-danger px-4 py-2 rounded-lg text-white font-medium">Fechar</button>
        <button id="imprimirRelatorioProducao" data-perm="ped.report" class="btn-primary px-6 py-2 rounded-lg text-white font-medium flex items-center gap-2" disabled>
          <i class="fas fa-print"></i> Imprimir
        </button>
      </div>
    </header>

    <!-- `min-h-0` é obrigatório: um filho `flex-1` NÃO encolhe abaixo do
         tamanho do conteúdo sem isso, então a barra de rolagem nunca aparecia e
         o modal esticava até estourar a tela. -->
    <div class="flex-1 min-h-0 overflow-y-auto modal-scroll">
      <p id="relatorioProducaoAviso" class="hidden px-8 pt-4 text-sm text-primary" role="status" aria-live="polite"></p>
      <div id="relatorioProducaoCorpo" class="px-8 py-6"></div>
    </div>
  </div>
</div>
