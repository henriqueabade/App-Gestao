<!--
  Detalhe de uma leitura: os arquivos enviados, o texto que a IA extraiu de
  cada um e as linhas que saíram daí.

  O overlay nasce `hidden`: quem revela é o `openModalWithSpinner`, ao receber
  `modalSpinnerLoaded`.
-->
<div id="iaDetalhesOverlay" class="hidden fixed inset-0 z-[1200] bg-black/60 flex items-center justify-center p-4">
  <div class="modal-ia modal-ia--largo glass-surface backdrop-blur-xl rounded-2xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade">

    <!-- Topo -->
    <div class="modal-ia__topo px-6 pt-6 pb-4 border-b border-white/10">
      <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
          <h3 id="iaDetTitulo" class="text-lg font-semibold text-white truncate">Leitura</h3>
          <p class="text-sm text-white/60 mt-1">
            <span id="iaDetDestino">—</span>
            <span class="text-white/30 px-2">•</span>
            <span id="iaDetData">—</span>
            <span class="text-white/30 px-2">•</span>
            <span id="iaDetUsuario">—</span>
          </p>
        </div>
        <span id="iaDetStatus" class="badge-ia badge-ia--rascunho flex-shrink-0">—</span>
      </div>

      <p id="iaDetErro" class="text-xs mt-3 hidden" style="color: var(--color-red)"></p>

      <!-- Abas -->
      <div class="flex items-center gap-2 mt-4" role="tablist">
        <button class="btn-neutral text-white rounded-lg px-4 py-2 text-sm font-medium"
                data-aba-ia="itens" role="tab" aria-selected="true">
          Itens lidos <span class="text-white/50" data-contador-ia="itens"></span>
        </button>
        <button class="btn-neutral text-white rounded-lg px-4 py-2 text-sm font-medium"
                data-aba-ia="arquivos" role="tab" aria-selected="false">
          Arquivos <span class="text-white/50" data-contador-ia="arquivos"></span>
        </button>
      </div>
    </div>

    <!-- Corpo -->
    <div class="modal-ia__corpo modal-scroll px-6 py-5">

      <!-- Itens -->
      <section data-painel-ia="itens">
        <div id="iaDetItensVazio" class="hidden py-10 text-center">
          <i class="fas fa-list-check text-4xl text-white/20"></i>
          <p class="text-sm text-white/50 mt-3">Nenhum item foi extraído desta leitura.</p>
        </div>
        <!--
          Enquanto a leitura está em revisão, a barra diz o que vai acontecer
          ao aplicar. Contar antes é o que evita a surpresa de descobrir, depois
          de gravar, que 12 itens iam cadastrar em vez de dar entrada.
        -->
        <div id="iaDetResumoRevisao" class="hidden ia-resumo-revisao"></div>

        <!--
          Cabeçalho e colunas vêm de `campos`, que o backend monta a partir do
          esquema do destino. Escrever as colunas aqui obrigaria a mexer neste
          arquivo a cada destino novo — e deixaria as duas listas divergirem.
        -->
        <div id="iaDetItensTabela" class="rounded-xl border border-white/10 ia-grade-revisao">
          <table class="w-full">
            <thead><tr id="iaDetItensCabecalho" class="bg-white/5"></tr></thead>
            <tbody id="iaDetItensCorpo" class="divide-y divide-white/10"></tbody>
          </table>
        </div>
        <datalist id="iaDetAlvos"></datalist>
      </section>

      <!-- Arquivos -->
      <section data-painel-ia="arquivos" class="hidden space-y-3">
        <div id="iaDetArquivosVazio" class="hidden py-10 text-center">
          <i class="fas fa-file-circle-question text-4xl text-white/20"></i>
          <p class="text-sm text-white/50 mt-3">Nenhum arquivo registrado nesta leitura.</p>
        </div>
        <div id="iaDetArquivosLista" class="space-y-3"></div>
      </section>

    </div>

    <!-- Os campos que não viraram coluna, editáveis no (i) de cada linha.
         Um só elemento, reposicionado a cada abertura. -->
    <div id="iaDetLinhaPopover" class="resumo-popover glass-surface rounded-xl p-4 text-white"></div>

    <!-- Rodapé -->
    <div class="modal-ia__rodape px-6 py-4 border-t border-white/10 flex items-center justify-between gap-4">
      <p id="iaDetRodapeAviso" class="text-xs text-white/45"></p>
      <div class="flex items-center gap-3 flex-shrink-0">
        <!-- Vermelho como o "Cancelar" de todos os outros modais do programa. -->
        <button id="iaDetFechar" type="button"
                class="btn-danger text-white rounded-lg px-5 py-2 text-sm font-medium">Fechar</button>
        <!-- Descarta as linhas marcadas. Transparente porque é uma ação de
             limpeza, não o caminho principal — e fica logo depois de Fechar,
             onde a mão já está depois de percorrer a tabela marcando. -->
        <button id="iaDetDescartar" type="button"
                class="ia-btn-transparente rounded-lg px-5 py-2 text-sm font-medium hidden">
          <i class="fas fa-ban mr-2"></i>Descartar selecionados
        </button>
        <!-- Aparece com a leitura em "Texto lido": o texto está guardado, então
             extrair pode ser repetido sem reenviar arquivo nenhum. -->
        <button id="iaDetExtrair" type="button" data-perm="ia.extract"
                class="btn-primary text-white rounded-lg px-5 py-2 text-sm font-medium hidden">
          <i class="fas fa-table-list mr-2"></i>Extrair os dados
        </button>
        <!-- Grava a lista inteira de uma vez, SEM abrir formulário.
             Existe para o caso em que abrir um formulário por linha seria
             inviável: uma planilha de fornecedor com 40 insumos. Fica ao lado
             do caminho normal, e não no lugar dele, porque gravar direto pula
             a conferência que o formulário do módulo faria. -->
        <button id="iaDetGravarTodos" type="button"
                class="btn-neutral text-white rounded-lg px-5 py-2 text-sm font-medium hidden">
          <i class="fas fa-bolt mr-2"></i>Gravar todos direto
        </button>
        <!-- O caminho normal: abre o formulário do módulo já preenchido, e
             quem salva é o usuário. Aparece com a leitura em revisão. -->
        <button id="iaDetAplicar" type="button"
                class="btn-success rounded-lg px-5 py-2 text-sm font-medium hidden">
          <i class="fas fa-up-right-from-square mr-2"></i>Abrir e preencher
        </button>
      </div>
    </div>

  </div>
</div>
