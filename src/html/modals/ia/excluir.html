<div id="iaExcluirOverlay" class="fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4">
  <div class="max-w-md w-full glass-surface backdrop-blur-xl rounded-2xl border border-white/10 ring-1 ring-white/5 shadow-2xl/40 animate-modalFade">
    <div class="p-6 text-center">
      <h3 class="text-lg font-semibold mb-4 text-white">Tem certeza?</h3>
      <p class="text-sm text-gray-300">
        Excluir a leitura
        <span id="iaExcluirNome" class="font-medium text-white"></span>?
      </p>
      <p class="text-xs text-gray-400 mt-3">
        Os arquivos lidos e os itens extraídos saem junto. Esta ação não pode ser desfeita.
      </p>
      <!--
        Quando a leitura já foi aplicada, o backend recusa. O aviso aparece
        aqui ANTES do clique: descobrir isso só depois de confirmar é pior.
      -->
      <p id="iaExcluirAvisoAplicada" class="text-xs mt-3 hidden" style="color: var(--color-primary-light)">
        Esta leitura já foi aplicada. Os registros que ela criou continuam nos módulos de destino
        e não serão removidos.
      </p>
      <div class="flex justify-center gap-6 mt-8">
        <button id="iaExcluirCancelar" class="btn-danger px-6 py-2 rounded-lg text-white font-medium active:scale-95">Não</button>
        <button id="iaExcluirConfirmar" data-perm="ia.delete" class="btn-success px-6 py-2 rounded-lg font-medium active:scale-95">Sim</button>
      </div>
    </div>
  </div>
</div>
