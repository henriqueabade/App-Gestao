<!-- Página principal do módulo Tarefas (CRM) — src/js/tarefas.js -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas - Santíssimo Decor</title>
    <link rel="stylesheet" href="../styles/tailwind-offline.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/tarefas.css">
    <link rel="stylesheet" href="../styles/scroll.css">
</head>
<body class="text-white">
  <div class="modulo-container tarefas-modulo tui-escopo ctl-padrao">
    <!-- Cabeçalho -->
    <header class="tarefas-cabecalho animate-fade-in-up">
      <div>
        <h1 class="text-2xl font-semibold mb-1 module-header__title">Tarefas</h1>
        <p class="module-header__description">O que é seu para fazer — dos clientes, das prospecções e o resto do dia</p>
      </div>
      <div class="tarefas-cabecalho__acoes">
        <button id="tarefasBtnAutomacoes" type="button" data-perm="tarefas.automations" class="btn-neutral ctl-botao tarefas-botao" hidden>
          <i class="fas fa-robot" aria-hidden="true"></i> Automáticas
        </button>
        <button id="tarefasBtnEstatisticas" type="button" data-perm="tarefas.stats" class="btn-secondary ctl-botao tarefas-botao">
          <i class="fas fa-chart-column" aria-hidden="true"></i> Estatísticas
        </button>
        <button id="tarefasBtnNova" type="button" data-perm="tarefas.create" class="btn-primary ctl-botao tarefas-botao">
          <i class="fas fa-plus" aria-hidden="true"></i> Nova tarefa
        </button>
      </div>
    </header>

    <div id="tarefasAvisoSql" class="tui-aviso-sql" hidden>
      <i class="fas fa-database" aria-hidden="true"></i>
      <span>As tarefas ainda não estão ativadas no banco: rode <strong>sql/tarefas_calendario.sql</strong> e reinicie a API.</span>
    </div>

    <!-- Criação rápida: o texto vira data, hora, prioridade, lista, marcador e pessoa -->
    <div class="tarefas-rapida animate-fade-in-up" data-perm="tarefas.create">
      <i class="fas fa-wand-magic-sparkles tarefas-rapida__icone" aria-hidden="true"></i>
      <input id="tarefasRapida" data-ctl-embutido type="text" maxlength="300" autocomplete="off"
             placeholder="Nova tarefa rápida — ex.: Ligar ACME amanhã 14h !alta #vip ~Lista @Ana   (Enter cria · Shift+Enter abre completa)"
             aria-label="Nova tarefa rápida">
      <div id="tarefasRapidaPrevia" class="tarefas-rapida__previa" aria-live="polite"></div>
    </div>

    <div class="tarefas-corpo animate-fade-in-up">
      <!-- Lateral: listas inteligentes, convites, listas e marcadores -->
      <aside class="tarefas-lado" aria-label="Filtros de tarefas">
        <nav id="tarefasInteligentes" class="tarefas-lado__grupo" aria-label="Listas inteligentes"></nav>

        <section class="tarefas-lado__grupo">
          <h3 class="tarefas-lado__titulo">Em conjunto</h3>
          <div id="tarefasColaboracao"></div>
        </section>

        <section class="tarefas-lado__grupo">
          <h3 class="tarefas-lado__titulo">
            <span>Minhas listas</span>
            <button id="tarefasNovaLista" type="button" class="tarefas-lado__mais" title="Nova lista" aria-label="Nova lista"><i class="fas fa-plus" aria-hidden="true"></i></button>
          </h3>
          <div id="tarefasListas"></div>
        </section>

        <section class="tarefas-lado__grupo">
          <h3 class="tarefas-lado__titulo">Marcadores</h3>
          <div id="tarefasMarcadores" class="tarefas-lado__marcadores"></div>
        </section>
      </aside>

      <!-- Principal -->
      <section class="tarefas-principal" aria-live="polite">
        <div class="tarefas-barra">
          <div class="tarefas-barra__titulo">
            <h2 id="tarefasTituloVisao">Hoje</h2>
            <span id="tarefasContagem" class="tarefas-barra__contagem"></span>
          </div>
          <div class="tarefas-barra__controles">
            <label class="tarefas-busca">
              <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
              <input id="tarefasBusca" data-ctl-embutido type="search" placeholder="Buscar  ( / )" aria-label="Buscar tarefas">
            </label>
            <select id="tarefasPessoa" class="ctl-campo ctl-campo--pequeno tarefas-select" aria-label="De quem" hidden></select>
            <select id="tarefasOrdem" class="ctl-campo ctl-campo--pequeno tarefas-select" aria-label="Ordenar">
              <option value="prazo">Por prazo</option>
              <option value="prioridade">Por prioridade</option>
              <option value="criacao">Mais novas</option>
              <option value="titulo">Por título</option>
            </select>
            <div class="tarefas-visao" role="tablist" aria-label="Visão">
              <button type="button" data-visao="lista" role="tab" aria-selected="true" title="Lista (1)"><i class="fas fa-list" aria-hidden="true"></i> Lista</button>
              <button type="button" data-visao="quadro" role="tab" aria-selected="false" title="Quadro (2)"><i class="fas fa-table-columns" aria-hidden="true"></i> Quadro</button>
            </div>
            <button id="tarefasAjuda" type="button" class="tarefas-icone-botao" title="Atalhos de teclado ( ? )" aria-label="Atalhos de teclado"><i class="fas fa-keyboard" aria-hidden="true"></i></button>
          </div>
        </div>
        <div id="tarefasConteudo" class="tarefas-conteudo"></div>
      </section>
    </div>
  </div>
</body>
</html>
