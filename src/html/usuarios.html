<!DOCTYPE html>
<!-- Tela principal do módulo Usuários -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: blob: file: https: http:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' http://localhost:3000 http://127.0.0.1:* https:; frame-ancestors 'none';"
    />
    <title>Gestão de Usuários - Santíssimo Decor</title>
    <link rel="stylesheet" href="../styles/tailwind-offline.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Estilos específicos do módulo -->
    <link rel="stylesheet" href="../css/usuarios.css">
    <!-- Estilos globais para barras de rolagem -->
    <link rel="stylesheet" href="../styles/scroll.css">
</head>
<body class="text-white">
  <div class="modulo-container ctl-padrao">
    <div>
        <!-- Header -->
        <div class="usuarios-header mb-8 animate-fade-in-up" >
            <div class="usuarios-header__info">
                <h1 class="text-2xl font-semibold mb-2 flex items-center gap-2 module-header__title">
                    Gestão de Usuários
                    <i
                      id="usuariosResumoInfo"
                      class="info-icon"
                      role="button"
                      tabindex="0"
                      aria-label="Ver resumo do módulo de usuários"
                    ></i>
                </h1>
                <p class="module-header__description">Controle e gerenciamento de Usuários</p>
            </div>

            <div class="usuarios-header__actions ctl-acoes">
                <button
                  id="btnModelosPermissao" data-perm="cfg.roles.edit"
                  type="button"
                  class="btn-bordo ctl-botao hidden text-white"
                >
                  <i class="fas fa-diagram-project w-4 h-4"></i>
                  Modelos de Permissão
                </button>
                <button id="btnNovoUsuario" data-perm="usuarios.create" class="btn-primary ctl-botao text-white">
                    <i class="fas fa-plus w-4 h-4"></i>
                    Novo Usuário
                </button>
            </div>
        </div>
        <!-- Popover de resumo -->
        <div id="resumoPopover" class="resumo-popover glass-surface rounded-xl p-6 text-white">
            <h3 class="ctl-secao mb-4 text-white">Resumo</h3>
            <div class="text-3xl font-bold text-white mb-2" id="totalUsuarios">0</div>
            <div class="text-sm text-gray-400 mb-4">Total de usuários</div>

            <!-- Status Distribution -->
            <div class="flex flex-wrap gap-2 mb-4" id="distribuicaoStatus"></div>

            <!-- Profile Distribution -->
            <div class="text-sm text-gray-400 space-y-1" id="distribuicaoPerfis"></div>
        </div>

        <!-- Barra de filtros horizontal -->
        <div class="glass-surface rounded-xl p-6 mb-6 animate-fade-in-up">
            <div class="filter-bar flex flex-col md:flex-row md:flex-wrap xl:flex-nowrap items-end">
                <!-- Search -->
                <div class="flex-1 min-w-[220px]">
                    <label class="ctl-rotulo text-white">Buscar</label>
                    <input id="filtroBusca" type="text" placeholder="Nome ou E-mail" class="ctl-campo input-glass text-white w-full placeholder-gray-400">
                </div>

                <!-- Profile Filter -->
                <div class="flex-1 min-w-[160px]">
                    <label class="ctl-rotulo text-white">Perfil</label>
                    <select id="filtroPerfil" class="ctl-campo select-glass text-white w-full">
                        <option value="">Todos</option>
                        <option value="admin">Admin</option>
                        <option value="operacional">Operacional</option>
                        <option value="cliente">Cliente</option>
                    </select>
                </div>

                <!-- Status Filter -->
                <div class="flex flex-col">
                    <label class="ctl-rotulo text-white">Status</label>
                    <div class="flex items-center gap-3 h-10">
                        <label class="flex items-center gap-2">
                            <input type="checkbox" class="checkbox-custom" value="ativo" checked>
                            <span class="text-sm text-white">Ativo</span>
                        </label>
                        <label class="flex items-center gap-2">
                            <input type="checkbox" class="checkbox-custom" value="inativo">
                            <span class="text-sm text-white">Inativo</span>
                        </label>
                        <label class="flex items-center gap-2">
                            <input type="checkbox" class="checkbox-custom" value="nao_confirmado">
                            <span class="text-sm text-white">Não confirmado</span>
                        </label>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div id= "bt-actions" class="ctl-acoes">
                    <button id="aplicarFiltro" data-perm="cfg.roles.view" class="btn-secondary ctl-botao text-white">Filtrar</button>
                    <button id="limparFiltro" data-perm="cfg.roles.view" class="btn-warning ctl-botao text-white">Limpar</button>
                </div>
            </div>
        </div>

        <!-- Users Table -->
        <div id="usuariosTableWrapper" class="glass-surface rounded-xl animate-fade-in-up table-scroll">
            <table class="w-full">
                <thead class="sticky top-0 bg-gray-50">
                    <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Avatar</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nome</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">E-mail</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Perfil</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Situação</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                        </tr>
                </thead>
                <tbody class="divide-y divide-white/10" id="listaUsuarios"></tbody>
                </table>
        </div>

        <!-- Empty State -->
        <div id="usuariosEmptyState" class="hidden py-12 flex flex-col items-center justify-center text-center px-4">
          <div class="rounded-full bg-[var(--color-primary-opacity)] p-8 mb-6">
            <i class="fas fa-box-open text-8xl text-[var(--color-primary)]"></i>
          </div>
          <h3 class="text-lg font-medium text-white">Nenhum usuário encontrado</h3>
          <p class="mt-1 text-sm text-white/70">Tente ajustar os filtros.</p>
          <div class="mt-6">
            <button
              id="usuariosEmptyNew"
              type="button"
              class="btn-primary ctl-botao text-white"
            >
              <i class="fas fa-plus w-4 h-4 mr-2"></i>
              Novo Usuário
            </button>
          </div>
        </div>
    </div>
</div>
</body>
</html>
